name: WordPress End-to-end Tests

on:
  push:
    branches:
      - main
      - trunk
  pull_request:

# Disable permissions for all available scopes by default.
# Any needed permissions should be configured at the job level.
permissions: {}

jobs:
  test:
    name: WordPress End-to-end Tests / ${{ matrix.backend }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read # Required to clone the repo.
    strategy:
      fail-fast: false
      matrix:
        backend:
          - sqlite
          - postgresql

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set UID and GID for PHP in WordPress images
        run: |
          echo "PHP_FPM_UID=$(id -u)" >> $GITHUB_ENV
          echo "PHP_FPM_GID=$(id -g)" >> $GITHUB_ENV

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run WordPress end-to-end tests
        env:
          WP_TEST_DB_BACKEND: ${{ matrix.backend }}
        run: composer run wp-test-e2e

      - name: Stop Docker containers
        if: always()
        env:
          WP_TEST_DB_BACKEND: ${{ matrix.backend }}
          LOCAL_DB_TYPE: mysql
          LOCAL_PHP_MEMCACHED: 'false'
        run: composer run wp-test-clean
