name: DuckDB Tests

on:
  push:
    branches:
      - trunk
    paths:
      - '.github/workflows/duckdb-phpunit-tests.yml'
      - '.github/workflows/wp-tests-phpunit-run.js'
      - 'bin/wp-test-ensure-env-duckdb.sh'
      - 'composer.json'
      - 'wp-setup.sh'
      - 'packages/mysql-on-sqlite/composer.json'
      - 'packages/mysql-on-sqlite/composer.lock'
      - 'packages/mysql-on-sqlite/src/load.php'
      - 'packages/mysql-on-sqlite/src/duckdb/**'
      - 'packages/mysql-on-sqlite/tests/duckdb/**'
      - 'packages/plugin-sqlite-database-integration/constants.php'
      - 'packages/plugin-sqlite-database-integration/db-duckdb.copy'
      - 'packages/plugin-sqlite-database-integration/wp-includes/db.php'
      - 'packages/plugin-sqlite-database-integration/wp-includes/duckdb/**'
  pull_request:
    paths:
      - '.github/workflows/duckdb-phpunit-tests.yml'
      - '.github/workflows/wp-tests-phpunit-run.js'
      - 'bin/wp-test-ensure-env-duckdb.sh'
      - 'composer.json'
      - 'wp-setup.sh'
      - 'packages/mysql-on-sqlite/composer.json'
      - 'packages/mysql-on-sqlite/composer.lock'
      - 'packages/mysql-on-sqlite/src/load.php'
      - 'packages/mysql-on-sqlite/src/duckdb/**'
      - 'packages/mysql-on-sqlite/tests/duckdb/**'
      - 'packages/plugin-sqlite-database-integration/constants.php'
      - 'packages/plugin-sqlite-database-integration/db-duckdb.copy'
      - 'packages/plugin-sqlite-database-integration/wp-includes/db.php'
      - 'packages/plugin-sqlite-database-integration/wp-includes/duckdb/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Disable permissions for all available scopes by default.
# Any needed permissions should be configured at the job level.
permissions: {}

jobs:
  duckdb-test:
    name: PHP 8.3 / DuckDB
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # Required to clone the repo.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ffi, pdo_sqlite
          ini-values: ffi.enable=true
          coverage: none
          tools: phpunit-polyfills

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v3
        with:
          working-directory: packages/mysql-on-sqlite
          ignore-cache: "yes"
          composer-options: "--optimize-autoloader"

      - name: Install DuckDB PHP client
        run: |
          composer config --no-plugins allow-plugins.satur.io/duckdb-auto true
          composer require --dev --no-plugins --no-interaction --with-all-dependencies satur.io/duckdb-auto
          composer dump-autoload
          ./vendor/bin/install-c-lib
        working-directory: packages/mysql-on-sqlite

      - name: Verify DuckDB runtime
        run: php -d ffi.enable=true -r "require 'vendor/autoload.php'; require 'src/load.php'; WP_DuckDB_Runtime::assert_available( true );"
        working-directory: packages/mysql-on-sqlite

      - name: Run DuckDB PHPUnit suite
        env:
          WP_DUCKDB_TESTS: '1'
          WP_DUCKDB_AUTOLOAD: ${{ github.workspace }}/packages/mysql-on-sqlite/vendor/autoload.php
          DUCKDB_PHP_AUTOLOAD: ${{ github.workspace }}/packages/mysql-on-sqlite/vendor/autoload.php
        run: php -d ffi.enable=true ./vendor/bin/phpunit -c ./phpunit.xml.dist --group duckdb
        working-directory: packages/mysql-on-sqlite

  wp-duckdb-test:
    name: WordPress PHPUnit wpdb / DuckDB
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read # Required to clone the repo.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set UID and GID for PHP in WordPress images
        run: |
          echo "PHP_FPM_UID=$(id -u)" >> $GITHUB_ENV
          echo "PHP_FPM_GID=$(id -g)" >> $GITHUB_ENV

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ffi, pdo_sqlite
          ini-values: ffi.enable=true
          coverage: none

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v3
        with:
          working-directory: packages/mysql-on-sqlite
          ignore-cache: "yes"
          composer-options: "--optimize-autoloader"

      - name: Install DuckDB PHP client
        run: |
          composer config --no-plugins allow-plugins.satur.io/duckdb-auto true
          composer require --dev --no-plugins --no-interaction --with-all-dependencies satur.io/duckdb-auto
          composer dump-autoload
          ./vendor/bin/install-c-lib
        working-directory: packages/mysql-on-sqlite

      - name: Verify DuckDB runtime
        run: php -d ffi.enable=true -r "require 'vendor/autoload.php'; require 'src/load.php'; WP_DuckDB_Runtime::assert_available( true );"
        working-directory: packages/mysql-on-sqlite

      - name: Run WordPress wpdb PHPUnit tests with DuckDB
        env:
          DUCKDB_PHP_AUTOLOAD: ${{ github.workspace }}/packages/mysql-on-sqlite/vendor/autoload.php
          WP_SQLITE_ENSURE_PHPUNIT_COMPATIBILITY: '1'
          WP_SQLITE_IGNORE_MISSING_EXPECTED_RESULTS: '1'
          WP_SQLITE_PHPUNIT_COMMAND: composer run wp-test-php-duckdb -- --group=wpdb --log-junit=phpunit-duckdb-results.xml --verbose
          WP_SQLITE_PHPUNIT_JUNIT_PATH: wordpress/phpunit-duckdb-results.xml
        run: node .github/workflows/wp-tests-phpunit-run.js

      - name: Dump WordPress DuckDB failure diagnostics
        if: failure() || cancelled()
        shell: bash
        run: |
          set +e

          if [ ! -d wordpress ]; then
            echo "wordpress directory is not present; skipping Docker and debug log diagnostics."
            exit 0
          fi

          echo "::group::Docker compose status"
          (
            cd wordpress || exit 0
            docker ps -a --format 'table {{.ID}}\t{{.Image}}\t{{.Status}}\t{{.Names}}' || true
            docker compose -f docker-compose.yml -f docker-compose.override.yml ps || true
            docker compose -f docker-compose.yml -f docker-compose.override.yml config --services || true
          ) || true
          echo "::endgroup::"

          echo "::group::Docker compose logs"
          (
            cd wordpress || exit 0
            docker compose -f docker-compose.yml -f docker-compose.override.yml logs --no-color --tail=200 || true
          ) || true
          echo "::endgroup::"

          echo "::group::WordPress container debug logs"
          (
            cd wordpress || exit 0
            services="$(docker compose -f docker-compose.yml -f docker-compose.override.yml config --services 2>/dev/null || true)"
            for service in php cli wordpress-develop; do
              if printf '%s\n' "$services" | grep -qx "$service"; then
                echo "===== $service debug.log tails ====="
                docker compose -f docker-compose.yml -f docker-compose.override.yml exec -T "$service" sh -lc 'for log_file in /var/www/src/wp-content/debug.log /var/www/build/wp-content/debug.log /var/www/html/wp-content/debug.log; do if [ -f "$log_file" ]; then echo "===== $log_file ====="; tail -n 200 "$log_file"; fi; done' || true
              fi
            done
          ) || true
          echo "::endgroup::"

          echo "::group::Local WordPress debug logs"
          mapfile -t debug_logs < <(
            find wordpress \
              -path '*/node_modules' -prune -o \
              -path '*/vendor' -prune -o \
              -name 'debug.log' -type f -print 2>/dev/null \
              | sort \
              | head -20
          )
          if [ "${#debug_logs[@]}" -eq 0 ]; then
            echo "No debug.log files found under wordpress/."
          fi
          for log_file in "${debug_logs[@]}"; do
            echo "===== $log_file ====="
            tail -n 200 "$log_file" || true
          done
          echo "::endgroup::"

          echo "::group::WordPress DuckDB runtime probes"
          (
            cd wordpress || exit 0
            services="$(docker compose -f docker-compose.yml -f docker-compose.override.yml config --services 2>/dev/null || true)"
            if printf '%s\n' "$services" | grep -qx 'php'; then
              docker compose -f docker-compose.yml -f docker-compose.override.yml exec -T php sh -lc 'for file in /var/www/src/wp-config.php /var/www/src/wp-content/db.php; do if [ -f "$file" ]; then echo "===== $file selected constants ====="; grep -nE "DB_ENGINE|DATABASE_TYPE|DUCKDB|WP_DEBUG" "$file" || true; fi; done' || true
            fi
            if printf '%s\n' "$services" | grep -qx 'cli'; then
              docker compose -f docker-compose.yml -f docker-compose.override.yml run --rm cli wp --path=/var/www/src eval 'global $wpdb; echo "wpdb_class=" . get_class( $wpdb ) . PHP_EOL; echo "db_engine=" . ( defined( "DB_ENGINE" ) ? DB_ENGINE : "<undefined>" ) . PHP_EOL; echo "last_error=" . $wpdb->last_error . PHP_EOL;' || true
            fi
            curl -i -sS -X POST \
              --data-urlencode 'log=admin' \
              --data-urlencode 'pwd=password' \
              --data-urlencode 'wp-submit=Log In' \
              http://localhost:8889/wp-login.php \
              | sed -E 's/(Set-Cookie: [^=]+=)[^;]*/\1<redacted>/Ig' \
              | sed -n '1,180p' || true
          ) || true
          echo "::endgroup::"

          true

      - name: Stop Docker containers
        if: always()
        run: composer run wp-test-clean

  wp-duckdb-e2e-test:
    name: WordPress E2E / DuckDB
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read # Required to clone the repo.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set UID and GID for PHP in WordPress images
        run: |
          echo "PHP_FPM_UID=$(id -u)" >> $GITHUB_ENV
          echo "PHP_FPM_GID=$(id -g)" >> $GITHUB_ENV

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ffi, pdo_sqlite
          ini-values: ffi.enable=true
          coverage: none

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v3
        with:
          working-directory: packages/mysql-on-sqlite
          ignore-cache: "yes"
          composer-options: "--optimize-autoloader"

      - name: Install DuckDB PHP client
        run: |
          composer config --no-plugins allow-plugins.satur.io/duckdb-auto true
          composer require --dev --no-plugins --no-interaction --with-all-dependencies satur.io/duckdb-auto
          composer dump-autoload
          ./vendor/bin/install-c-lib
        working-directory: packages/mysql-on-sqlite

      - name: Verify DuckDB runtime
        run: php -d ffi.enable=true -r "require 'vendor/autoload.php'; require 'src/load.php'; WP_DuckDB_Runtime::assert_available( true );"
        working-directory: packages/mysql-on-sqlite

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Prepare WordPress DuckDB end-to-end environment
        env:
          DUCKDB_PHP_AUTOLOAD: ${{ github.workspace }}/packages/mysql-on-sqlite/vendor/autoload.php
        run: composer run wp-test-ensure-env-duckdb

      - name: Serialize WordPress PHP-FPM for DuckDB end-to-end tests
        run: |
          set -euo pipefail
          cd wordpress
          cat > docker-compose.duckdb-e2e.yml <<'YAML'
          services:
            php:
              command:
                - /bin/sh
                - -c
                - |
                  if [ "$$LOCAL_PHP_MEMCACHED" = true ]; then
                    cp -n /var/www/tests/phpunit/includes/object-cache.php /var/www/src/wp-content/object-cache.php
                  else
                    rm -f /var/www/src/wp-content/object-cache.php
                  fi
                  pool_config=/usr/local/etc/php-fpm.d/www.conf
                  sed -ri 's/^[[:space:]]*pm[[:space:]]*=.*/pm = static/' "$$pool_config"
                  sed -ri 's/^[[:space:]]*pm\.max_children[[:space:]]*=.*/pm.max_children = 1/' "$$pool_config"
                  grep -Eq '^[[:space:]]*pm[[:space:]]*=[[:space:]]*static' "$$pool_config"
                  grep -Eq '^[[:space:]]*pm\.max_children[[:space:]]*=[[:space:]]*1' "$$pool_config"
                  php-fpm -tt
                  exec php-fpm
          YAML
          docker compose -f docker-compose.yml -f docker-compose.override.yml -f docker-compose.duckdb-e2e.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.override.yml -f docker-compose.duckdb-e2e.yml up -d --no-deps --force-recreate php
          docker compose -f docker-compose.yml -f docker-compose.override.yml -f docker-compose.duckdb-e2e.yml exec -T php sh -lc 'grep -Eq "^[[:space:]]*pm[[:space:]]*=[[:space:]]*static" /usr/local/etc/php-fpm.d/www.conf && grep -Eq "^[[:space:]]*pm\\.max_children[[:space:]]*=[[:space:]]*1" /usr/local/etc/php-fpm.d/www.conf'
          docker compose -f docker-compose.yml -f docker-compose.override.yml -f docker-compose.duckdb-e2e.yml exec -T php php -r 'exit( extension_loaded( "ffi" ) ? 0 : 1 );'

      - name: Install WordPress 500 response diagnostics
        run: |
          cat > wordpress/src/wp-content/duckdb-e2e-500-diagnostics.php <<'PHP'
          <?php
          /**
           * Logs request-scoped database state for DuckDB E2E 500 responses.
           */

          if ( ! defined( 'SAVEQUERIES' ) ) {
           define( 'SAVEQUERIES', true );
          }
          if ( ! defined( 'WP_DUCKDB_E2E_DIAGNOSTICS' ) ) {
           define( 'WP_DUCKDB_E2E_DIAGNOSTICS', true );
          }

          register_shutdown_function(
           static function () {
            $status = function_exists( 'http_response_code' ) ? (int) http_response_code() : 0;
            if ( 500 > $status ) {
             return;
            }

            global $wpdb;

            $diagnostics = array(
             'status'       => $status,
             'method'       => isset( $_SERVER['REQUEST_METHOD'] ) ? $_SERVER['REQUEST_METHOD'] : '',
             'uri'          => isset( $_SERVER['REQUEST_URI'] ) ? $_SERVER['REQUEST_URI'] : '',
             'wpdb_class'   => is_object( $wpdb ) ? get_class( $wpdb ) : gettype( $wpdb ),
             'last_error'   => '',
             'last_query'   => '',
             'rows_affected' => null,
             'insert_id'    => null,
             'driver_class' => null,
             'driver_insert_id' => null,
             'num_queries'  => null,
             'queries_tail' => array(),
             'duckdb_queries_tail' => array(),
             'php_error'    => error_get_last(),
            );

            if ( is_object( $wpdb ) ) {
             if ( isset( $wpdb->last_error ) ) {
              $diagnostics['last_error'] = (string) $wpdb->last_error;
             }
             if ( isset( $wpdb->last_query ) ) {
              $diagnostics['last_query'] = (string) $wpdb->last_query;
             }
             if ( isset( $wpdb->rows_affected ) ) {
              $diagnostics['rows_affected'] = (int) $wpdb->rows_affected;
             }
             if ( isset( $wpdb->insert_id ) ) {
              $diagnostics['insert_id'] = (int) $wpdb->insert_id;
             }
             if ( isset( $wpdb->num_queries ) ) {
              $diagnostics['num_queries'] = (int) $wpdb->num_queries;
             }
             try {
              $reflection = new ReflectionObject( $wpdb );
              if ( $reflection->hasProperty( 'dbh' ) ) {
               $property = $reflection->getProperty( 'dbh' );
               $property->setAccessible( true );
               $driver = $property->getValue( $wpdb );

               if ( is_object( $driver ) ) {
                $diagnostics['driver_class'] = get_class( $driver );
                if ( method_exists( $driver, 'get_insert_id' ) ) {
                 $diagnostics['driver_insert_id'] = (int) $driver->get_insert_id();
                }
                if ( method_exists( $driver, 'get_last_duckdb_queries' ) ) {
                 $diagnostics['duckdb_queries_tail'] = array_slice( $driver->get_last_duckdb_queries(), -5 );
                }
               }
              }
             } catch ( Throwable $e ) {
              $diagnostics['driver_probe_error'] = $e->getMessage();
             }
             if ( isset( $wpdb->queries ) && is_array( $wpdb->queries ) ) {
              foreach ( array_slice( $wpdb->queries, -5 ) as $query ) {
               if ( is_array( $query ) ) {
                $diagnostics['queries_tail'][] = array(
                 'query'  => isset( $query[0] ) ? (string) $query[0] : '',
                 'time'   => isset( $query[1] ) ? $query[1] : null,
                 'caller' => isset( $query[2] ) ? (string) $query[2] : '',
                );
                continue;
               }

               $diagnostics['queries_tail'][] = (string) $query;
              }
             }
            }

            $encoded = function_exists( 'wp_json_encode' )
             ? wp_json_encode( $diagnostics, JSON_UNESCAPED_SLASHES )
             : json_encode( $diagnostics );

            error_log( '[duckdb-e2e-500] ' . $encoded );
           }
          );
          PHP
          php -l wordpress/src/wp-content/duckdb-e2e-500-diagnostics.php
          php -r '
          $file     = $argv[1];
          $contents = file_get_contents( $file );
          $needle   = "require_once \$sqlite_plugin_implementation_folder_path . " . chr( 39 ) . "/wp-includes/db.php" . chr( 39 ) . ";";
          $insert   = "require_once __DIR__ . " . chr( 39 ) . "/duckdb-e2e-500-diagnostics.php" . chr( 39 ) . ";\n";

          if ( false === strpos( $contents, $needle ) ) {
           fwrite( STDERR, "Could not find DuckDB db.php insertion point.\n" );
           exit( 1 );
          }

          if ( false === strpos( $contents, $insert ) ) {
           file_put_contents( $file, str_replace( $needle, $insert . $needle, $contents ) );
          }
          ' wordpress/src/wp-content/db.php

      - name: Run WordPress end-to-end tests with DuckDB
        env:
          DUCKDB_PHP_AUTOLOAD: ${{ github.workspace }}/packages/mysql-on-sqlite/vendor/autoload.php
        run: npm --prefix wordpress run test:e2e --

      - name: Dump WordPress DuckDB failure diagnostics
        if: failure() || cancelled()
        shell: bash
        run: |
          set +e

          if [ ! -d wordpress ]; then
            echo "wordpress directory is not present; skipping Docker and debug log diagnostics."
            exit 0
          fi

          echo "::group::Docker compose status"
          (
            cd wordpress || exit 0
            docker ps -a --format 'table {{.ID}}\t{{.Image}}\t{{.Status}}\t{{.Names}}' || true
            docker compose -f docker-compose.yml -f docker-compose.override.yml ps || true
            docker compose -f docker-compose.yml -f docker-compose.override.yml config --services || true
          ) || true
          echo "::endgroup::"

          echo "::group::Docker compose logs"
          (
            cd wordpress || exit 0
            docker compose -f docker-compose.yml -f docker-compose.override.yml logs --no-color --tail=200 || true
          ) || true
          echo "::endgroup::"

          echo "::group::WordPress container debug logs"
          (
            cd wordpress || exit 0
            services="$(docker compose -f docker-compose.yml -f docker-compose.override.yml config --services 2>/dev/null || true)"
            for service in php cli wordpress-develop; do
              if printf '%s\n' "$services" | grep -qx "$service"; then
                echo "===== $service debug.log tails ====="
                docker compose -f docker-compose.yml -f docker-compose.override.yml exec -T "$service" sh -lc 'for log_file in /var/www/src/wp-content/debug.log /var/www/build/wp-content/debug.log /var/www/html/wp-content/debug.log; do if [ -f "$log_file" ]; then echo "===== $log_file ====="; tail -n 200 "$log_file"; fi; done' || true
              fi
            done
          ) || true
          echo "::endgroup::"

          echo "::group::Local WordPress debug logs"
          mapfile -t debug_logs < <(
            find wordpress \
              -path '*/node_modules' -prune -o \
              -path '*/vendor' -prune -o \
              -name 'debug.log' -type f -print 2>/dev/null \
              | sort \
              | head -20
          )
          if [ "${#debug_logs[@]}" -eq 0 ]; then
            echo "No debug.log files found under wordpress/."
          fi
          for log_file in "${debug_logs[@]}"; do
            echo "===== $log_file ====="
            tail -n 200 "$log_file" || true
          done
          echo "::endgroup::"

          echo "::group::WordPress DuckDB runtime probes"
          (
            cd wordpress || exit 0
            services="$(docker compose -f docker-compose.yml -f docker-compose.override.yml config --services 2>/dev/null || true)"
            if printf '%s\n' "$services" | grep -qx 'php'; then
              docker compose -f docker-compose.yml -f docker-compose.override.yml exec -T php sh -lc 'for file in /var/www/src/wp-config.php /var/www/src/wp-content/db.php; do if [ -f "$file" ]; then echo "===== $file selected constants ====="; grep -nE "DB_ENGINE|DATABASE_TYPE|DUCKDB|WP_DEBUG" "$file" || true; fi; done' || true
            fi
            if printf '%s\n' "$services" | grep -qx 'cli'; then
              docker compose -f docker-compose.yml -f docker-compose.override.yml run --rm cli wp --path=/var/www/src eval 'global $wpdb; echo "wpdb_class=" . get_class( $wpdb ) . PHP_EOL; echo "db_engine=" . ( defined( "DB_ENGINE" ) ? DB_ENGINE : "<undefined>" ) . PHP_EOL; echo "last_error=" . $wpdb->last_error . PHP_EOL;' || true
            fi
            curl -i -sS -X POST \
              --data-urlencode 'log=admin' \
              --data-urlencode 'pwd=password' \
              --data-urlencode 'wp-submit=Log In' \
              http://localhost:8889/wp-login.php \
              | sed -E 's/(Set-Cookie: [^=]+=)[^;]*/\1<redacted>/Ig' \
              | sed -n '1,180p' || true
          ) || true
          echo "::endgroup::"

          true

      - name: Stop Docker containers
        if: always()
        run: composer run wp-test-clean
