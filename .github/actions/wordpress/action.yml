name: Prepare WordPress
description: Restore the WordPress repository and its dependencies from the cache, or set them up.
runs:
  using: composite
  steps:
    - name: Resolve WordPress cache key
      id: wordpress
      shell: bash
      env:
        # "wp-setup.sh" and the "db.php" source file decide what ends up in the "wordpress" folder.
        SETUP_HASH: ${{ hashFiles( 'wp-setup.sh', 'packages/plugin-sqlite-database-integration/db.copy' ) }}
      run: |
        version="$( sed -n 's/^WP_VERSION="\(.*\)"$/\1/p' wp-setup.sh )"
        commit="$( git ls-remote --exit-code https://github.com/WordPress/wordpress-develop.git "refs/heads/$version" | cut -f1 )"
        echo "cache-key=wordpress-$( node --version )-$commit-$SETUP_HASH" >> "$GITHUB_OUTPUT"

    - name: Restore WordPress from the cache
      id: cache
      uses: actions/cache/restore@v6
      with:
        path: wordpress
        key: ${{ steps.wordpress.outputs.cache-key }}

    - name: Set up WordPress
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: composer run wp-test-ensure-php-env

    # Save right after the setup, so that the cache doesn't include anything created by the tests.
    - name: Save WordPress to the cache
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: wordpress
        key: ${{ steps.wordpress.outputs.cache-key }}
