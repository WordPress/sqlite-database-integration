name: Verify plugin release metadata

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify-version:
    name: Assert the release metadata is internally consistent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none

      - name: Verify release metadata
        run: bash ./.github/scripts/verify-release-metadata.sh
