name: PHPUnit Tests (Turso DB)

on:
  push:
    branches:
      - main
  pull_request:

# The test suite is run against Turso DB (https://github.com/tursodatabase/turso),
# a Rust reimplementation of SQLite. Turso is still in beta and its SQLite C API
# is only partially implemented. Known incompatibilities are patched below so
# unexpected failures can identify compatibility regressions.
jobs:
  test:
    name: PHP 8.5 / Turso DB (latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Pin main for reproducible builds while still tracking Turso fixes that
      # have not reached a release. Bump this SHA periodically.
      - name: Set Turso commit to build
        id: turso
        run: echo "sha=83d0f02f567f54ed9529f0b3955f294d3836a134" >> "$GITHUB_OUTPUT"

      - name: Cache Turso build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            turso/target
          key: turso-${{ runner.os }}-${{ steps.turso.outputs.sha }}-${{ hashFiles('.github/workflows/phpunit-tests-turso.yml') }}

      - name: Clone Turso source
        run: |
          target_cache_dir=
          if [ -d turso/target ]; then
            target_cache_dir="$(mktemp -d)"
            mv turso/target "$target_cache_dir/target"
          fi

          rm -rf turso
          git clone --filter=blob:none https://github.com/tursodatabase/turso.git
          git -C turso checkout '${{ steps.turso.outputs.sha }}'

          if [ -n "$target_cache_dir" ]; then
            mv "$target_cache_dir/target" turso/target
            rmdir "$target_cache_dir"
          fi

      # Each Turso fix is a self-contained Python script under
      # .github/turso-patches/. apply.sh runs them in lexicographic
      # order from the Turso source root. See that directory's
      # README.md for the rationale and how to add or retire a fix.
      - name: Patch Turso to not abort on recoverable conditions
        working-directory: turso
        run: ../.github/turso-patches/apply.sh

      - name: Build turso_sqlite3 shared library
        working-directory: turso
        run: cargo build --release -p turso_sqlite3

      - name: Verify Turso shared library exposes SQLite3 C API
        id: turso-lib
        run: |
          LIB="$GITHUB_WORKSPACE/turso/target/release/libturso_sqlite3.so"
          test -f "$LIB"
          echo "Library: $LIB"
          echo "path=$LIB" >> "$GITHUB_OUTPUT"
          echo '--- Sample of exported sqlite3_* symbols ---'
          nm -D --defined-only "$LIB" | awk '$3 ~ /^sqlite3_/ {print $3}' | sort | head -20

      # Turso only exports the _v2 variants of several functions, but PHP's
      # pdo_sqlite calls the older names (sqlite3_create_function, sqlite3_prepare,
      # etc.). Without an override, those symbols fall through to the system
      # libsqlite3 at runtime, which then operates on a Turso-allocated handle
      # and segfaults. This shim provides the missing names as thin wrappers
      # that delegate to the _v2 variants; LD_PRELOAD'd before Turso, it makes
      # pdo_sqlite see a complete sqlite3 C API backed entirely by Turso.
      - name: Build pdo_sqlite compatibility shim
        id: shim
        run: |
          cat > /tmp/turso-compat-shim.c <<'C'
          #include <stdio.h>
          #include <stdarg.h>
          #include <stdlib.h>
          #include <string.h>

          typedef struct sqlite3 sqlite3;
          typedef struct sqlite3_stmt sqlite3_stmt;
          typedef struct sqlite3_value sqlite3_value;
          typedef struct sqlite3_context sqlite3_context;

          extern int sqlite3_create_function_v2(
              sqlite3 *db, const char *name, int n_arg, int enc, void *app,
              void (*x_func)(sqlite3_context*, int, sqlite3_value**),
              void (*x_step)(sqlite3_context*, int, sqlite3_value**),
              void (*x_final)(sqlite3_context*),
              void (*x_destroy)(void*));

          int sqlite3_create_function(
              sqlite3 *db, const char *name, int n_arg, int enc, void *app,
              void (*x_func)(sqlite3_context*, int, sqlite3_value**),
              void (*x_step)(sqlite3_context*, int, sqlite3_value**),
              void (*x_final)(sqlite3_context*))
          {
              return sqlite3_create_function_v2(db, name, n_arg, enc, app,
                                                x_func, x_step, x_final, 0);
          }

          extern int sqlite3_prepare_v2(sqlite3 *db, const char *sql, int nbytes,
              sqlite3_stmt **out_stmt, const char **tail);

          int sqlite3_prepare(sqlite3 *db, const char *sql, int nbytes,
              sqlite3_stmt **out_stmt, const char **tail)
          {
              return sqlite3_prepare_v2(db, sql, nbytes, out_stmt, tail);
          }

          extern int sqlite3_create_collation_v2(sqlite3 *db, const char *name,
              int enc, void *ctx,
              int (*cmp)(void*, int, const void*, int, const void*),
              void (*destroy)(void*));

          int sqlite3_create_collation(sqlite3 *db, const char *name, int enc,
              void *ctx,
              int (*cmp)(void*, int, const void*, int, const void*))
          {
              return sqlite3_create_collation_v2(db, name, enc, ctx, cmp, 0);
          }

          // SQLite's own formatting API. Turso doesn't export it. A naive
          // libc-only wrapper breaks because SQLite defines extra conversion
          // specifiers (%q, %Q, %w) that libc vsnprintf doesn't understand —
          // in particular, pdo_sqlite's quote() uses sqlite3_mprintf("'%q'",s),
          // so without %q support every quoted value becomes garbled. This
          // implementation parses the format itself, handles the SQLite
          // extensions explicitly, and delegates standard specifiers to libc.
          struct buf { char *p; size_t len, cap; };

          static int buf_append(struct buf *b, const char *s, size_t n) {
              if (b->len + n + 1 > b->cap) {
                  size_t new_cap = b->cap ? b->cap * 2 : 64;
                  while (new_cap < b->len + n + 1) new_cap *= 2;
                  char *np = (char *)realloc(b->p, new_cap);
                  if (!np) return -1;
                  b->p = np;
                  b->cap = new_cap;
              }
              memcpy(b->p + b->len, s, n);
              b->len += n;
              b->p[b->len] = '\0';
              return 0;
          }

          static int buf_append_c(struct buf *b, char c) { return buf_append(b, &c, 1); }

          static int buf_append_quoted(struct buf *b, const char *s, char q) {
              for (; *s; s++) {
                  if (*s == q && buf_append_c(b, q) < 0) return -1;
                  if (buf_append_c(b, *s) < 0) return -1;
              }
              return 0;
          }

          // Build a result string by parsing fmt and consuming ap as needed.
          static char *vmprintf_impl(const char *fmt, va_list ap) {
              struct buf b = {0};

              while (*fmt) {
                  if (*fmt != '%') {
                      if (buf_append_c(&b, *fmt++) < 0) { free(b.p); return NULL; }
                      continue;
                  }
                  const char *spec_start = fmt;
                  fmt++;
                  // Flags, width, precision, length — collected for libc fallback.
                  while (*fmt && strchr("-+ #0'", *fmt)) fmt++;
                  while (*fmt == '*') { va_arg(ap, int); fmt++; }
                  while (*fmt && *fmt >= '0' && *fmt <= '9') fmt++;
                  if (*fmt == '.') {
                      fmt++;
                      if (*fmt == '*') { va_arg(ap, int); fmt++; }
                      while (*fmt && *fmt >= '0' && *fmt <= '9') fmt++;
                  }
                  int is_long = 0, is_long_long = 0;
                  while (*fmt && strchr("hljztL", *fmt)) {
                      if (*fmt == 'l') { if (is_long) is_long_long = 1; else is_long = 1; }
                      if (*fmt == 'j' || *fmt == 'z') is_long_long = 1;
                      fmt++;
                  }
                  char conv = *fmt;
                  if (!conv) break;
                  fmt++;

                  if (conv == 'q' || conv == 'Q' || conv == 'w') {
                      const char *arg = va_arg(ap, const char *);
                      if (conv == 'Q' && !arg) {
                          if (buf_append(&b, "NULL", 4) < 0) { free(b.p); return NULL; }
                      } else {
                          char qchar = (conv == 'w') ? '"' : '\'';
                          if (conv == 'Q' && buf_append_c(&b, qchar) < 0) { free(b.p); return NULL; }
                          if (arg && buf_append_quoted(&b, arg, qchar) < 0) { free(b.p); return NULL; }
                          if (conv == 'Q' && buf_append_c(&b, qchar) < 0) { free(b.p); return NULL; }
                      }
                      continue;
                  }

                  // Standard conversion — rebuild the spec and call libc snprintf
                  // for the single specifier, then append the result.
                  size_t speclen = (size_t)(fmt - spec_start);
                  char spec[64];
                  if (speclen + 1 > sizeof spec) speclen = sizeof spec - 1;
                  memcpy(spec, spec_start, speclen);
                  spec[speclen] = '\0';

                  char tmp[128];
                  char *out = tmp;
                  int n = 0;
                  if (conv == 's' || conv == 'z') {
                      const char *a = va_arg(ap, const char *);
                      n = snprintf(tmp, sizeof tmp, spec, a ? a : "(null)");
                      if (n >= (int)sizeof tmp) {
                          out = (char *)malloc((size_t)n + 1);
                          if (!out) { free(b.p); return NULL; }
                          snprintf(out, (size_t)n + 1, spec, a ? a : "(null)");
                      }
                      if (conv == 'z' && a) free((void *)a);
                  } else if (conv == 'c') {
                      int a = va_arg(ap, int);
                      n = snprintf(tmp, sizeof tmp, spec, a);
                  } else if (conv == 'd' || conv == 'i' || conv == 'u' || conv == 'x' ||
                             conv == 'X' || conv == 'o') {
                      if (is_long_long) {
                          long long a = va_arg(ap, long long);
                          n = snprintf(tmp, sizeof tmp, spec, a);
                      } else if (is_long) {
                          long a = va_arg(ap, long);
                          n = snprintf(tmp, sizeof tmp, spec, a);
                      } else {
                          int a = va_arg(ap, int);
                          n = snprintf(tmp, sizeof tmp, spec, a);
                      }
                  } else if (conv == 'e' || conv == 'E' || conv == 'f' || conv == 'F' ||
                             conv == 'g' || conv == 'G') {
                      double a = va_arg(ap, double);
                      n = snprintf(tmp, sizeof tmp, spec, a);
                  } else if (conv == 'p') {
                      void *a = va_arg(ap, void *);
                      n = snprintf(tmp, sizeof tmp, spec, a);
                  } else if (conv == '%') {
                      tmp[0] = '%'; tmp[1] = '\0'; n = 1;
                  } else {
                      // Unknown specifier — pass through literally.
                      memcpy(tmp, spec_start, speclen);
                      tmp[speclen] = '\0';
                      n = (int)speclen;
                  }

                  if (n > 0 && buf_append(&b, out, (size_t)n) < 0) {
                      if (out != tmp) free(out);
                      free(b.p);
                      return NULL;
                  }
                  if (out != tmp) free(out);
              }
              if (!b.p) {
                  b.p = (char *)malloc(1);
                  if (b.p) b.p[0] = '\0';
              }
              return b.p;
          }

          char *sqlite3_vmprintf(const char *fmt, va_list ap) {
              return vmprintf_impl(fmt, ap);
          }

          char *sqlite3_mprintf(const char *fmt, ...) {
              va_list ap;
              va_start(ap, fmt);
              char *s = vmprintf_impl(fmt, ap);
              va_end(ap);
              return s;
          }

          char *sqlite3_vsnprintf(int n, char *dst, const char *fmt, va_list ap) {
              if (!dst || n <= 0) return dst;
              char *s = vmprintf_impl(fmt, ap);
              if (!s) { dst[0] = '\0'; return dst; }
              size_t copy = strlen(s);
              if (copy > (size_t)(n - 1)) copy = (size_t)(n - 1);
              memcpy(dst, s, copy);
              dst[copy] = '\0';
              free(s);
              return dst;
          }

          char *sqlite3_snprintf(int n, char *dst, const char *fmt, ...) {
              va_list ap;
              va_start(ap, fmt);
              sqlite3_vsnprintf(n, dst, fmt, ap);
              va_end(ap);
              return dst;
          }
          C

          SHIM=/tmp/libturso-compat-shim.so
          gcc -shared -fPIC -Wall -O2 -o "$SHIM" /tmp/turso-compat-shim.c
          echo "Shim library: $SHIM"
          nm -D --defined-only "$SHIM" | awk '$3 ~ /^sqlite3_/ {print $3}'
          echo "path=$SHIM" >> "$GITHUB_OUTPUT"

      - name: Combine LD_PRELOAD paths
        id: preload
        run: echo "value=${{ steps.shim.outputs.path }}:${{ steps.turso-lib.outputs.path }}" >> "$GITHUB_OUTPUT"

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: phpunit-polyfills

      - name: Smoke-test pdo_sqlite against Turso
        continue-on-error: true
        env:
          LD_PRELOAD: ${{ steps.preload.outputs.value }}
        run: |
          php <<'PHP'
          <?php
          echo "version: ", (new PDO('sqlite::memory:'))->query('SELECT sqlite_version()')->fetch()[0], "\n";

          $pdo = new PDO('sqlite::memory:');
          $pdo->setAttribute(PDO::ATTR_ERRMODE, PDO::ERRMODE_EXCEPTION);
          $pdo->exec('CREATE TABLE t (id INTEGER PRIMARY KEY, v TEXT)');
          echo "create table: ok\n";

          $pdo->exec("INSERT INTO t (v) VALUES ('hello')");
          echo "insert exec: ok\n";

          $stmt = $pdo->prepare('INSERT INTO t (v) VALUES (?)');
          $stmt->execute(['world']);
          echo "insert prepared: ok\n";

          $rows = $pdo->query('SELECT id, v FROM t ORDER BY id')->fetchAll(PDO::FETCH_ASSOC);
          echo "select: ", json_encode($rows), "\n";

          $stmt = $pdo->prepare('SELECT v FROM t WHERE id = ?');
          $stmt->execute([1]);
          echo "select prepared: ", $stmt->fetchColumn(), "\n";

          unset($stmt, $pdo);
          echo "close: ok\n";
          PHP

      - name: Probe Turso columnN binding in INSERT-SELECT-FROM-VALUES
        continue-on-error: true
        env:
          LD_PRELOAD: ${{ steps.preload.outputs.value }}
        run: |
          php <<'PHP'
          <?php
          // Probes Turso behaviour for the columnN reference pattern that the
          // mysql-on-sqlite driver emits for INSERT...VALUES type casting.
          // Each form is a small variation; we run them in isolation and
          // print the outcome so we can see exactly which shape Turso rejects.
          $pdo = new PDO('sqlite::memory:');
          $pdo->setAttribute(PDO::ATTR_ERRMODE, PDO::ERRMODE_EXCEPTION);
          $pdo->exec('CREATE TABLE t (v INTEGER)');

          $cases = [
              'top-level SELECT column1 FROM (VALUES) (1 col)' =>
                  'SELECT column1 FROM (VALUES (5))',
              'top-level SELECT CAST(`column1`) FROM (VALUES) WHERE true (1 col)' =>
                  'SELECT CAST(`column1` AS INTEGER) FROM (VALUES (5)) WHERE true',
              'INSERT...SELECT CAST(`column1`) FROM (VALUES) WHERE true (1 col)' =>
                  'INSERT INTO t (v) SELECT CAST(`column1` AS INTEGER) FROM (VALUES (5)) WHERE true',
              'top-level SELECT column1, column2 FROM (VALUES) (2 cols)' =>
                  'SELECT column1, column2 FROM (VALUES (5, 6))',
              'INSERT...SELECT CAST(`column1`), CAST(`column2`) FROM (VALUES) WHERE true (2 cols)' =>
                  'INSERT INTO t2 (a, b) SELECT CAST(`column1` AS INTEGER), CAST(`column2` AS INTEGER) FROM (VALUES (5, 6)) WHERE true',
              'INSERT (3 cols)' =>
                  'INSERT INTO t3 (a, b, c) SELECT CAST(`column1` AS INTEGER), CAST(`column2` AS INTEGER), CAST(`column3` AS INTEGER) FROM (VALUES (5, 6, 7)) WHERE true',
              'INSERT (5 cols, refer column5)' =>
                  'INSERT INTO t5 (a, b, c, d, e) SELECT CAST(`column1` AS INTEGER), CAST(`column2` AS INTEGER), CAST(`column3` AS INTEGER), CAST(`column4` AS INTEGER), CAST(`column5` AS INTEGER) FROM (VALUES (1, 2, 3, 4, 5)) WHERE true',
              'INSERT (3 cols, no backticks)' =>
                  'INSERT INTO t3 (a, b, c) SELECT CAST(column1 AS INTEGER), CAST(column2 AS INTEGER), CAST(column3 AS INTEGER) FROM (VALUES (5, 6, 7)) WHERE true',
              'top-level SELECT column1, column2 FROM (SELECT...)' =>
                  'SELECT column1, column2 FROM (SELECT 5 AS column1, 6 AS column2)',
              'INSERT (3 cols) FROM (SELECT…AS column1)' =>
                  'INSERT INTO t3 (a, b, c) SELECT CAST(column1 AS INTEGER), CAST(column2 AS INTEGER), CAST(column3 AS INTEGER) FROM (SELECT 5 AS column1, 6 AS column2, 7 AS column3) WHERE true',
              'INSERT (3 cols) CTE(VALUES) AS src(c1, c2, c3)' =>
                  "INSERT INTO t3 (a, b, c) WITH src(column1, column2, column3) AS (VALUES (5, 6, 7)) SELECT CAST(column1 AS INTEGER), CAST(column2 AS INTEGER), CAST(column3 AS INTEGER) FROM src WHERE true",
          ];
          $pdo->exec('CREATE TABLE t2 (a INTEGER, b INTEGER)');
          $pdo->exec('CREATE TABLE t3 (a INTEGER, b INTEGER, c INTEGER)');
          $pdo->exec('CREATE TABLE t5 (a INTEGER, b INTEGER, c INTEGER, d INTEGER, e INTEGER)');
          foreach ($cases as $label => $sql) {
              try {
                  $stmt = $pdo->query($sql);
                  if ($stmt && stripos($sql, 'INSERT') === false) {
                      $stmt->fetchAll();
                  }
                  echo "OK   $label\n";
              } catch (Throwable $e) {
                  echo "FAIL $label -> " . $e->getMessage() . "\n";
              }
              foreach (['t', 't2', 't3', 't5'] as $tbl) {
                  try { $pdo->exec("DELETE FROM $tbl"); } catch (Throwable $_) {}
              }
          }

      - name: Probe Turso TEMP table I/O
        continue-on-error: true
        env:
          LD_PRELOAD: ${{ steps.preload.outputs.value }}
        run: |
          php <<'PHP'
          <?php
          // Reproduce the testCreateTemporaryTable failure shape directly,
          // varying schema features one at a time so we can see which
          // shape Turso fails on.
          $cases = [
              'plain temp table create+drop' =>
                  [
                      "CREATE TEMPORARY TABLE _t1 (id INTEGER, v TEXT)",
                      "DROP TABLE _t1",
                  ],
              'temp table with PRIMARY KEY AUTOINCREMENT, plain' =>
                  [
                      "CREATE TEMPORARY TABLE _t2 (id INTEGER PRIMARY KEY AUTOINCREMENT, v TEXT)",
                      "DROP TABLE _t2",
                  ],
              'temp table with NOT NULL DEFAULT' =>
                  [
                      "CREATE TEMPORARY TABLE _t3 (id INTEGER PRIMARY KEY AUTOINCREMENT, v TEXT NOT NULL DEFAULT '')",
                      "DROP TABLE _t3",
                  ],
              'temp table create + insert + select + drop' =>
                  [
                      "CREATE TEMPORARY TABLE _t4 (id INTEGER PRIMARY KEY AUTOINCREMENT, v TEXT)",
                      "INSERT INTO _t4 (v) VALUES ('a')",
                      "SELECT * FROM _t4",
                      "DROP TABLE _t4",
                  ],
              'temp table same name as a real table' =>
                  [
                      "CREATE TABLE _t5 (id INTEGER, v TEXT)",
                      "CREATE TEMPORARY TABLE _t5 (id INTEGER, v TEXT)",
                      "DROP TABLE _t5",
                      "DROP TABLE _t5",
                  ],
          ];
          foreach ($cases as $label => $stmts) {
              $pdo = new PDO('sqlite::memory:');
              $pdo->setAttribute(PDO::ATTR_ERRMODE, PDO::ERRMODE_EXCEPTION);
              $err = null;
              foreach ($stmts as $i => $s) {
                  try { $pdo->exec($s); }
                  catch (Throwable $e) {
                      $err = "stmt #$i ($s) -> " . $e->getMessage();
                      break;
                  }
              }
              echo ($err ? "FAIL " : "OK   ") . $label . ($err ? " -> $err" : "") . "\n";
              unset($pdo);
          }

      - name: Probe Turso PDO churn — does state accumulate that breaks later queries?
        continue-on-error: true
        env:
          LD_PRELOAD: ${{ steps.preload.outputs.value }}
        run: |
          php <<'PHP'
          <?php
          // The 3 failing tests all pass in fresh-PDO probes but fail
          // mid-suite. This probe simulates the suite's PDO churn:
          // open N PDOs, run a smattering of operations on each, close.
          // Then in a final fresh PDO, run the failing-test query shape
          // and see whether the bug manifests.
          //
          // If the bug reproduces past some N, we have a minimal repro
          // and can bisect what specifically accumulates.
          function setup_and_run(int $churn_count): array {
              // Mimic the driver's setUp: register a bunch of UDFs and run
              // common PRAGMAs, like WP_PDO_MySQL_On_SQLite::__construct does.
              $udf_names = [
                  'throw','month','monthnum','year','day','hour','minute','second','week',
                  'weekday','dayofweek','dayofmonth','unix_timestamp','now','md5','curdate',
                  'rand','from_unixtime','localtime','localtimestamp','isnull','if','regexp',
                  'field','log','least','greatest','get_lock','release_lock','ucase','lcase',
                  'concat','date_add','date_sub','dayname','monthname','quarter','last_day',
                  'time_to_sec','timestampdiff','date_format','find_in_set','char_length','format',
              ];
              for ($i = 0; $i < $churn_count; $i++) {
                  $pdo_class = PHP_VERSION_ID >= 80400 ? PDO\SQLite::class : PDO::class;
                  $p = new $pdo_class('sqlite::memory:');
                  $p->setAttribute(PDO::ATTR_ERRMODE, PDO::ERRMODE_EXCEPTION);
                  $p->setAttribute(PDO::ATTR_TIMEOUT, 30);
                  $p->setAttribute(PDO::ATTR_STRINGIFY_FETCHES, true);
                  $p->query('PRAGMA foreign_keys = ON');
                  foreach ($udf_names as $name) {
                      if ($p instanceof PDO\SQLite) {
                          $p->createFunction($name, function (...$a) { return ''; });
                      } else {
                          $p->sqliteCreateFunction($name, function (...$a) { return ''; });
                      }
                  }
                  $p->exec('CREATE TABLE t (id INT, v TEXT)');
                  $p->exec("INSERT INTO t VALUES (1, 'a'), (2, 'b'), (3, 'c')");
                  $p->query('SELECT * FROM t');
                  $p->exec('CREATE TEMPORARY TABLE t2 (id INT)');
                  $p->exec("INSERT INTO t2 VALUES (1)");
                  unset($p);
              }
              // Now in a fresh PDO, run the failing-test shape.
              $p = new PDO('sqlite::memory:');
              $p->setAttribute(PDO::ATTR_ERRMODE, PDO::ERRMODE_EXCEPTION);
              $p->exec("CREATE TABLE _ist (table_schema TEXT, table_name TEXT)");
              $p->exec("CREATE TABLE _isc (table_schema TEXT, table_name TEXT, column_name TEXT, extra TEXT)");
              $p->exec("INSERT INTO _ist VALUES ('main','low'), ('main','high'), ('main','plain')");
              $p->exec("INSERT INTO _isc VALUES ('main','low','id','auto_increment'), ('main','high','id','auto_increment'), ('main','plain','id','')");
              $p->exec("CREATE TABLE sqlseq (name TEXT, seq INT)");
              $p->exec("INSERT INTO sqlseq VALUES ('low',1), ('high',5)");
              $derived = "(SELECT table_name AS NAME,
                  (SELECT COALESCE(s.seq + 1, 1) FROM _isc AS c LEFT JOIN sqlseq AS s ON s.name = c.table_name
                   WHERE c.extra = 'auto_increment' AND c.table_schema = t.table_schema AND c.table_name = t.table_name) AS AI
                  FROM _ist AS t)";
              $rows1 = $p->query("SELECT NAME FROM $derived WHERE AI > 3")->fetchAll(PDO::FETCH_COLUMN);
              // also run a temp-table sequence
              $temp_ok = true;
              $temp_err = null;
              try {
                  $p->exec('CREATE TEMPORARY TABLE _ttest (id INTEGER PRIMARY KEY AUTOINCREMENT, v TEXT NOT NULL DEFAULT \'\')');
                  $p->exec('DROP TABLE _ttest');
              } catch (Throwable $e) { $temp_ok = false; $temp_err = $e->getMessage(); }
              return ['filter_rows' => $rows1, 'temp_ok' => $temp_ok, 'temp_err' => $temp_err];
          }
          foreach ([0, 1, 5, 20, 50, 100, 200, 500] as $n) {
              $r = setup_and_run($n);
              $rows = json_encode($r['filter_rows']);
              $temp = $r['temp_ok'] ? 'temp OK' : 'temp FAIL: '.$r['temp_err'];
              echo "churn=$n  filter_rows=$rows  $temp\n";
          }

      - name: Probe Turso correlated subquery in derived-table SELECT list
        continue-on-error: true
        env:
          LD_PRELOAD: ${{ steps.preload.outputs.value }}
        run: |
          php <<'PHP'
          <?php
          // Reproduce testInformationSchemaTablesFilterByAutoIncrement's exact
          // shape — info_schema-style tables and the *exact* translate_table_ref
          // correlated subquery (LEFT JOIN inside subquery + COALESCE).
          // Also use Turso's REAL `sqlite_sequence` (a special table) by
          // creating tables with INTEGER PRIMARY KEY AUTOINCREMENT, which
          // is what the driver sets up for AUTO_INCREMENT columns.
          $pdo = new PDO('sqlite::memory:');
          $pdo->setAttribute(PDO::ATTR_ERRMODE, PDO::ERRMODE_EXCEPTION);
          // Mirror the driver's information schema layout and seed it.
          $pdo->exec("CREATE TABLE _ist (table_schema TEXT, table_name TEXT, engine TEXT)");
          $pdo->exec("CREATE TABLE _isc (table_schema TEXT, table_name TEXT, column_name TEXT, extra TEXT)");
          $pdo->exec("INSERT INTO _ist VALUES ('main','low','InnoDB'), ('main','high','InnoDB'), ('main','plain','InnoDB')");
          $pdo->exec("INSERT INTO _isc VALUES ('main','low','id','auto_increment'), ('main','high','id','auto_increment'), ('main','plain','id','')");
          // Real sqlite_sequence: create AUTOINCREMENT tables and insert.
          $pdo->exec("CREATE TABLE low (id INTEGER PRIMARY KEY AUTOINCREMENT, n TEXT)");
          $pdo->exec("CREATE TABLE high (id INTEGER PRIMARY KEY AUTOINCREMENT, n TEXT)");
          $pdo->exec("INSERT INTO low (n) VALUES ('a')");
          $pdo->exec("INSERT INTO high (n) VALUES ('a'),('b'),('c'),('d'),('e')");
          // (Also keep the fake table for comparison — used in the cases below.)
          $pdo->exec("CREATE TABLE sqlseq (name TEXT, seq INT)");
          $pdo->exec("INSERT INTO sqlseq VALUES ('low',1), ('high',5)");

          // Driver's actual correlated subquery shape:
          $corr = "(SELECT COALESCE(s.seq + 1, 1)
                    FROM _isc AS c
                    LEFT JOIN sqlseq AS s ON s.name = c.table_name
                    WHERE c.extra = 'auto_increment'
                    AND c.table_schema = t.table_schema
                    AND c.table_name = t.table_name)";

          $derived = "(SELECT table_name AS NAME, $corr AS AI FROM _ist AS t)";

          // Variants using REAL sqlite_sequence (special table populated by AUTOINCREMENT)
          $real_corr = "(SELECT COALESCE(s.seq + 1, 1)
                    FROM _isc AS c
                    LEFT JOIN sqlite_sequence AS s ON s.name = c.table_name
                    WHERE c.extra = 'auto_increment'
                    AND c.table_schema = t.table_schema
                    AND c.table_name = t.table_name)";
          $real_derived = "(SELECT table_name AS NAME, $real_corr AS AI FROM _ist AS t)";

          $cases = [
              'fake-seq inline correlated subq value' =>
                  "SELECT table_name, $corr AS AI FROM _ist AS t",
              'fake-seq derived-table + WHERE AI > 3 (the bug)' =>
                  "SELECT NAME FROM $derived WHERE AI > 3",
              'fake-seq derived-table + WHERE AI IS NULL' =>
                  "SELECT NAME FROM $derived WHERE AI IS NULL",
              'fake-seq derived-table + plain SELECT' =>
                  "SELECT NAME, AI FROM $derived",
              'real-seq inline correlated subq value' =>
                  "SELECT table_name, $real_corr AS AI FROM _ist AS t",
              'real-seq derived-table + WHERE AI > 3 (the bug)' =>
                  "SELECT NAME FROM $real_derived WHERE AI > 3",
              'real-seq derived-table + WHERE AI IS NULL' =>
                  "SELECT NAME FROM $real_derived WHERE AI IS NULL",
              'real-seq derived-table + plain SELECT' =>
                  "SELECT NAME, AI FROM $real_derived",
              // Just dump real sqlite_sequence to confirm it has the right values
              'real sqlite_sequence dump' =>
                  "SELECT name, seq FROM sqlite_sequence ORDER BY name",
          ];
          foreach ($cases as $label => $sql) {
              try {
                  $rows = $pdo->query($sql)->fetchAll(PDO::FETCH_NUM);
                  $rows_pretty = array_map(fn($r) => '['.implode(',', array_map(fn($v) => $v === null ? 'NULL' : $v, $r)).']', $rows);
                  echo "ROW  $label  =>  " . implode(' ', $rows_pretty) . "\n";
              } catch (Throwable $e) {
                  echo "FAIL $label -> " . $e->getMessage() . "\n";
              }
          }

      - name: Install Composer dependencies (root)
        uses: ramsey/composer-install@v3
        with:
          ignore-cache: "yes"
          composer-options: "--optimize-autoloader"

      - name: Install Composer dependencies (mysql-on-sqlite)
        uses: ramsey/composer-install@v3
        with:
          working-directory: packages/mysql-on-sqlite
          ignore-cache: "yes"
          composer-options: "--optimize-autoloader"

      - name: Install gdb
        run: sudo apt-get install -y --no-install-recommends gdb

      # These patches to the driver work around Turso behaviours that the SQL
      # layer in this repo currently assumes. Each is a localised rewrite so
      # the driver still produces correct behaviour when run against Turso;
      # they are not behaviour changes for real SQLite.
      - name: Patch driver for Turso compatibility
        working-directory: packages/mysql-on-sqlite
        run: |
          python3 - <<'PY'
          # 1. Turso's UPDATE parser doesn't accept row-value assignment from
          #    a subquery ("SET (a, b) = (SELECT ...)") — 82 tests fail with
          #    "2 columns assigned 1 values". Rewrite sync_column_key_info's
          #    single UPDATE into two correlated subqueries, one per column.
          path = 'src/sqlite/class-wp-sqlite-information-schema-builder.php'
          src = open(path).read()
          old = (
              "\t\t$this->connection->query(\n"
              "\t\t\t'\n"
              "\t\t\t\tUPDATE ' . $this->connection->quote_identifier( $columns_table_name ) . \" AS c\n"
              "\t\t\t\tSET (column_key, is_nullable) = (\n"
              "\t\t\t\t\tSELECT\n"
              "\t\t\t\t\t\tCASE\n"
              "\t\t\t\t\t\t\tWHEN MAX(s.index_name = 'PRIMARY') THEN 'PRI'\n"
              "\t\t\t\t\t\t\tWHEN MAX(s.non_unique = 0 AND s.seq_in_index = 1) THEN 'UNI'\n"
              "\t\t\t\t\t\t\tWHEN MAX(s.seq_in_index = 1) THEN 'MUL'\n"
              "\t\t\t\t\t\t\tELSE ''\n"
              "\t\t\t\t\t\tEND,\n"
              "\t\t\t\t\t\tCASE\n"
              "\t\t\t\t\t\t\tWHEN MAX(s.index_name = 'PRIMARY') THEN 'NO'\n"
              "\t\t\t\t\t\t\tELSE c.is_nullable\n"
              "\t\t\t\t\t\tEND\n"
              "\t\t\t\t\tFROM \" . $this->connection->quote_identifier( $statistics_table_name ) . ' AS s\n"
              "\t\t\t\t\tWHERE s.table_schema = c.table_schema\n"
              "\t\t\t\t\tAND s.table_name = c.table_name\n"
              "\t\t\t\t\tAND s.column_name = c.column_name\n"
              "\t\t\t\t)\n"
              "\t\t\t    WHERE c.table_schema = ?\n"
              "\t\t\t    AND c.table_name = ?\n"
              "\t\t\t',\n"
              "\t\t\tarray( self::SAVED_DATABASE_NAME, $table_name )\n"
              "\t\t);"
          )
          assert old in src, 'sync_column_key_info UPDATE not found'
          # The aggregate-without-GROUP-BY form combined with a bare
          # correlated column (`ELSE c.is_nullable`) in the CASE relies on
          # SQLite's "bare column alongside aggregate" extension. Turso does
          # not implement that the same way and corrupts is_nullable in both
          # directions. Rewrite with EXISTS subqueries — pure boolean form
          # that Turso handles correctly.
          new = "\n".join([
              "\t\t$columns_table    = $this->connection->quote_identifier( $columns_table_name );",
              "\t\t$statistics_table = $this->connection->quote_identifier( $statistics_table_name );",
              "\t\t$this->connection->query(",
              "\t\t\t\"",
              "\t\t\t\tUPDATE $columns_table AS c",
              "\t\t\t\tSET column_key = CASE",
              "\t\t\t\t\tWHEN EXISTS (",
              "\t\t\t\t\t\tSELECT 1 FROM $statistics_table AS s",
              "\t\t\t\t\t\tWHERE s.table_schema = c.table_schema",
              "\t\t\t\t\t\t  AND s.table_name   = c.table_name",
              "\t\t\t\t\t\t  AND s.column_name  = c.column_name",
              "\t\t\t\t\t\t  AND s.index_name   = 'PRIMARY'",
              "\t\t\t\t\t) THEN 'PRI'",
              "\t\t\t\t\tWHEN EXISTS (",
              "\t\t\t\t\t\tSELECT 1 FROM $statistics_table AS s",
              "\t\t\t\t\t\tWHERE s.table_schema = c.table_schema",
              "\t\t\t\t\t\t  AND s.table_name   = c.table_name",
              "\t\t\t\t\t\t  AND s.column_name  = c.column_name",
              "\t\t\t\t\t\t  AND s.non_unique   = 0",
              "\t\t\t\t\t\t  AND s.seq_in_index = 1",
              "\t\t\t\t\t) THEN 'UNI'",
              "\t\t\t\t\tWHEN EXISTS (",
              "\t\t\t\t\t\tSELECT 1 FROM $statistics_table AS s",
              "\t\t\t\t\t\tWHERE s.table_schema = c.table_schema",
              "\t\t\t\t\t\t  AND s.table_name   = c.table_name",
              "\t\t\t\t\t\t  AND s.column_name  = c.column_name",
              "\t\t\t\t\t\t  AND s.seq_in_index = 1",
              "\t\t\t\t\t) THEN 'MUL'",
              "\t\t\t\t\tELSE ''",
              "\t\t\t\tEND,",
              "\t\t\t\tis_nullable = CASE",
              "\t\t\t\t\tWHEN EXISTS (",
              "\t\t\t\t\t\tSELECT 1 FROM $statistics_table AS s",
              "\t\t\t\t\t\tWHERE s.table_schema = c.table_schema",
              "\t\t\t\t\t\t  AND s.table_name   = c.table_name",
              "\t\t\t\t\t\t  AND s.column_name  = c.column_name",
              "\t\t\t\t\t\t  AND s.index_name   = 'PRIMARY'",
              "\t\t\t\t\t) THEN 'NO'",
              "\t\t\t\t\tELSE c.is_nullable",
              "\t\t\t\tEND",
              "\t\t\t\tWHERE c.table_schema = ?",
              "\t\t\t\tAND c.table_name = ?",
              "\t\t\t\",",
              "\t\t\tarray( self::SAVED_DATABASE_NAME, $table_name )",
              "\t\t);",
          ])
          src = src.replace(old, new, 1)
          open(path, 'w').write(src)
          print('patched sync_column_key_info UPDATE (EXISTS form)')

          # 2. Turso doesn't implement `PRAGMA foreign_key_check`. The driver
          #    runs it after every ALTER TABLE to validate foreign keys; its
          #    failure breaks ~34 tests. Skip it under Turso by wrapping in
          #    a try/catch that swallows the "Not a valid pragma name" error.
          path = 'src/sqlite/class-wp-pdo-mysql-on-sqlite.php'
          src = open(path).read()
          old = "\t\t\t$this->execute_sqlite_query( 'PRAGMA foreign_key_check' );"
          new = "\t\t\ttry { $this->execute_sqlite_query( 'PRAGMA foreign_key_check' ); } catch ( \\PDOException $e ) { /* Turso: not implemented */ }"
          assert old in src, 'PRAGMA foreign_key_check not found'
          src = src.replace(old, new, 1)
          open(path, 'w').write(src)
          print('patched PRAGMA foreign_key_check')

          # 3. Turso prefixes constraint errors with "Runtime error: " which
          #    SQLite doesn't. It also appends " (19)" (the SQLite error code)
          #    to some messages. Tests compare against the SQLite format, so
          #    strip Turso's extra decoration when rethrowing.
          old = "\t\t\tthrow $this->new_driver_exception( $e->getMessage(), $e->getCode(), $e );"
          new = (
              "\t\t\t$msg = $e->getMessage();\n"
              "\t\t\t// Normalise Turso-specific decoration to SQLite format.\n"
              "\t\t\t$msg = str_replace( 'Runtime error: ', '', $msg );\n"
              "\t\t\t$msg = preg_replace( '/ \\(19\\)$/', '', $msg );\n"
              "\t\t\t// UNIQUE constraint failed: t.(a, b) -> t.a, t.b\n"
              "\t\t\t$msg = preg_replace_callback(\n"
              "\t\t\t\t'/(\\w+)\\.\\(([^)]+)\\)/',\n"
              "\t\t\t\tfunction ( $m ) {\n"
              "\t\t\t\t\t$cols = array_map( 'trim', explode( ',', $m[2] ) );\n"
              "\t\t\t\t\treturn implode( ', ', array_map( fn( $c ) => $m[1] . '.' . $c, $cols ) );\n"
              "\t\t\t\t},\n"
              "\t\t\t\t$msg\n"
              "\t\t\t);\n"
              "\t\t\t// Turso lowercases column names in UNIQUE-constraint errors;\n"
              "\t\t\t// restore original casing from information_schema.\n"
              "\t\t\t$msg = preg_replace_callback(\n"
              "\t\t\t\t'/(\\w+)\\.(\\w+)/',\n"
              "\t\t\t\tfunction ( $m ) {\n"
              "\t\t\t\t\ttry {\n"
              "\t\t\t\t\t\t$cols_table = $this->information_schema_builder->get_table_name( false, 'columns' );\n"
              "\t\t\t\t\t\t$canonical = $this->execute_sqlite_query(\n"
              "\t\t\t\t\t\t\tsprintf(\n"
              "\t\t\t\t\t\t\t\t'SELECT column_name FROM %s WHERE table_name = ? AND lower(column_name) = ?',\n"
              "\t\t\t\t\t\t\t\t$this->quote_sqlite_identifier( $cols_table )\n"
              "\t\t\t\t\t\t\t),\n"
              "\t\t\t\t\t\t\tarray( $m[1], strtolower( $m[2] ) )\n"
              "\t\t\t\t\t\t)->fetchColumn();\n"
              "\t\t\t\t\t\treturn $m[1] . '.' . ( $canonical !== false ? $canonical : $m[2] );\n"
              "\t\t\t\t\t} catch ( \\Throwable $_ ) {\n"
              "\t\t\t\t\t\treturn $m[0];\n"
              "\t\t\t\t\t}\n"
              "\t\t\t\t},\n"
              "\t\t\t\t$msg\n"
              "\t\t\t);\n"
              "\t\t\tthrow $this->new_driver_exception( $msg, $e->getCode(), $e );"
          )
          assert old in src, 'rethrow block not found'
          src = src.replace(old, new, 1)
          open(path, 'w').write(src)
          print('patched Turso error-message normalisation')

          # 4. Turso forbids writes to sqlite_sequence with "may not be modified".
          #    The driver tries to DELETE from it when truncating a table; extend
          #    the existing "no such table" swallow to also accept this error.
          old = (
              "\t\t} catch ( PDOException $e ) {\n"
              "\t\t\tif ( str_contains( $e->getMessage(), 'no such table' ) ) {\n"
              "\t\t\t\t// The table might not exist if no sequences are used in the DB.\n"
              "\t\t\t} else {\n"
              "\t\t\t\tthrow $e;\n"
              "\t\t\t}\n"
              "\t\t}"
          )
          new = (
              "\t\t} catch ( PDOException $e ) {\n"
              "\t\t\tif (\n"
              "\t\t\t\tstr_contains( $e->getMessage(), 'no such table' )\n"
              "\t\t\t\t|| str_contains( $e->getMessage(), 'may not be modified' ) // Turso\n"
              "\t\t\t) {\n"
              "\t\t\t\t// Table missing, or write forbidden (Turso). Ignore.\n"
              "\t\t\t} else {\n"
              "\t\t\t\tthrow $e;\n"
              "\t\t\t}\n"
              "\t\t}"
          )
          assert old in src, 'sqlite_sequence catch not found'
          src = src.replace(old, new, 1)
          open(path, 'w').write(src)
          print('patched sqlite_sequence catch')

          # 5. wp_die polyfill: real WordPress provides wp_die(); the unit-test
          # bootstrap doesn't, so tests hit an 'undefined function' error when
          # a driver error path tries to call it.
          path = 'tests/bootstrap.php'
          src = open(path).read()
          marker = "if ( ! function_exists( 'do_action' ) ) {"
          inject = (
              "if ( ! function_exists( 'wp_die' ) ) {\n"
              "\tfunction wp_die( $message = '', $title = '', $args = array() ) {\n"
              "\t\tthrow new \\RuntimeException( is_string( $message ) ? $message : 'wp_die' );\n"
              "\t}\n"
              "}\n\n"
          )
          assert marker in src
          src = src.replace(marker, inject + marker, 1)
          open(path, 'w').write(src)
          print('added wp_die polyfill to bootstrap.php')

          # 6. Turso's PRAGMA table_xinfo preserves outer parens on
          #    `DEFAULT (expr)` columns (real SQLite strips them). That defeats
          #    the reconstructor's typed checks and falls through to
          #    quote_mysql_utf8_string_literal, so SHOW CREATE TABLE emits
          #    DEFAULT '(CURRENT_TIMESTAMP)' / DEFAULT '(1 + 2)' instead of
          #    DEFAULT CURRENT_TIMESTAMP / DEFAULT '1 + 2'. Strip outer parens
          #    at the top of generate_column_default so the typed checks see
          #    the bare expression.
          path = 'src/sqlite/class-wp-sqlite-information-schema-reconstructor.php'
          src = open(path).read()
          old = (
              "\tprivate function generate_column_default( string $mysql_type, ?string $default_value ): ?string {\n"
              "\t\tif ( null === $default_value || '' === $default_value ) {\n"
              "\t\t\treturn null;\n"
              "\t\t}\n"
          )
          new = (
              "\tprivate function generate_column_default( string $mysql_type, ?string $default_value ): ?string {\n"
              "\t\tif ( null === $default_value || '' === $default_value ) {\n"
              "\t\t\treturn null;\n"
              "\t\t}\n"
              "\t\tif ( strlen( $default_value ) >= 2 && '(' === $default_value[0] && ')' === substr( $default_value, -1 ) ) {\n"
              "\t\t\t$default_value = trim( substr( $default_value, 1, -1 ) );\n"
              "\t\t}\n"
          )
          assert old in src, 'generate_column_default prologue not found'
          src = src.replace(old, new, 1)
          open(path, 'w').write(src)
          print('patched reconstructor default-value paren stripping')

          # 7. Turso's PRAGMA table_xinfo returns signed numeric literals with
          #    a space between sign and digits ("- 1.23", "+ 1.23") — real
          #    SQLite returns "-1.23". Our is_numeric() check rejects the
          #    spaced form; collapse the gap so the literal is recognised.
          src = open(path).read()
          old = (
              "\t\t// Numeric literals. E.g.: 123, 1.23, -1.23, 1e3, 1.2e-3\n"
              "\t\tif ( is_numeric( $no_underscore_default_value ) ) {\n"
              "\t\t\treturn $no_underscore_default_value;\n"
              "\t\t}\n"
          )
          new = (
              "\t\t// Numeric literals. E.g.: 123, 1.23, -1.23, 1e3, 1.2e-3\n"
              "\t\t$normalised_numeric = preg_replace( '/^([+-])\\s+/', '$1', $no_underscore_default_value );\n"
              "\t\tif ( is_numeric( $normalised_numeric ) ) {\n"
              "\t\t\treturn $normalised_numeric;\n"
              "\t\t}\n"
          )
          assert old in src, 'generate_column_default numeric block not found'
          src = src.replace(old, new, 1)
          open(path, 'w').write(src)
          print('patched reconstructor signed-numeric spacing')

          # 8. Turso mangles implicit column names for hex literals like
          #    x'417a' (drops the "x'" prefix). Force an explicit alias for
          #    hex-literal SELECT items so the column name matches the source
          #    text, as MySQL/SQLite produce.
          path = 'src/sqlite/class-wp-pdo-mysql-on-sqlite.php'
          src = open(path).read()
          old = (
              "\t\t$raw_alias = substr( $this->last_mysql_query, $node->get_start(), $node->get_length() );\n"
              "\t\t$alias     = $this->quote_sqlite_identifier( $raw_alias );\n"
              "\t\tif ( $alias === $item || $raw_alias === $item ) {\n"
              "\t\t\t// For the simple case of selecting only columns (\"SELECT id FROM t\"),\n"
              "\t\t\t// let's avoid unnecessary aliases (\"SELECT `id` AS `id` FROM t\").\n"
              "\t\t\treturn $item;\n"
              "\t\t}\n"
          )
          new = (
              "\t\t$raw_alias = substr( $this->last_mysql_query, $node->get_start(), $node->get_length() );\n"
              "\t\t$alias     = $this->quote_sqlite_identifier( $raw_alias );\n"
              "\t\t$is_hex_literal = ( 0 === strncasecmp( $item, \"x'\", 2 ) );\n"
              "\t\tif ( ! $is_hex_literal && ( $alias === $item || $raw_alias === $item ) ) {\n"
              "\t\t\t// For the simple case of selecting only columns (\"SELECT id FROM t\"),\n"
              "\t\t\t// let's avoid unnecessary aliases (\"SELECT `id` AS `id` FROM t\").\n"
              "\t\t\treturn $item;\n"
              "\t\t}\n"
          )
          assert old in src, 'translate_select_item block not found'
          src = src.replace(old, new, 1)
          open(path, 'w').write(src)
          print('patched hex-literal alias force under Turso')

          # 10. CHECK TABLE on a missing table on real SQLite raises from
          #     `PRAGMA integrity_check(<tbl>)`; on Turso the PRAGMA is a
          #     no-op for unknown tables, so testCheckTable sees status=OK
          #     instead of the expected "Table 'missing' doesn't exist"
          #     error. Check sqlite_master explicitly before the PRAGMA.
          path = 'src/sqlite/class-wp-pdo-mysql-on-sqlite.php'
          src = open(path).read()
          old = (
              "\t\t\t\t\tcase WP_MySQL_Lexer::CHECK_SYMBOL:\n"
              "\t\t\t\t\t\t$stmt   = $this->execute_sqlite_query(\n"
              "\t\t\t\t\t\t\tsprintf( 'PRAGMA integrity_check(%s)', $quoted_table_name )\n"
              "\t\t\t\t\t\t);\n"
              "\t\t\t\t\t\t$errors = $stmt->fetchAll( PDO::FETCH_COLUMN );\n"
              "\t\t\t\t\t\tif ( 'ok' === $errors[0] ) {\n"
              "\t\t\t\t\t\t\tarray_shift( $errors );\n"
              "\t\t\t\t\t\t}\n"
              "\t\t\t\t\t\tbreak;\n"
          )
          new = (
              "\t\t\t\t\tcase WP_MySQL_Lexer::CHECK_SYMBOL:\n"
              "\t\t\t\t\t\t$exists_stmt = $this->execute_sqlite_query(\n"
              "\t\t\t\t\t\t\t\"SELECT 1 FROM sqlite_master WHERE type='table' AND name=?\",\n"
              "\t\t\t\t\t\t\tarray( $table_name )\n"
              "\t\t\t\t\t\t);\n"
              "\t\t\t\t\t\tif ( ! $exists_stmt->fetchColumn() ) {\n"
              "\t\t\t\t\t\t\t$errors = array( \"Table '$table_name' doesn't exist\" );\n"
              "\t\t\t\t\t\t\tbreak;\n"
              "\t\t\t\t\t\t}\n"
              "\t\t\t\t\t\t$stmt   = $this->execute_sqlite_query(\n"
              "\t\t\t\t\t\t\tsprintf( 'PRAGMA integrity_check(%s)', $quoted_table_name )\n"
              "\t\t\t\t\t\t);\n"
              "\t\t\t\t\t\t$errors = $stmt->fetchAll( PDO::FETCH_COLUMN );\n"
              "\t\t\t\t\t\tif ( 'ok' === $errors[0] ) {\n"
              "\t\t\t\t\t\t\tarray_shift( $errors );\n"
              "\t\t\t\t\t\t}\n"
              "\t\t\t\t\t\tbreak;\n"
          )
          assert old in src, 'CHECK TABLE handler not found'
          open(path, 'w').write(src.replace(old, new, 1))
          print('patched CHECK TABLE missing-table check')

          # 15. DEFAULT_GENERATED path wraps the translated expression in parens
          #     unconditionally: `DEFAULT (<expr>)`. Real SQLite strips the outer
          #     parens on round-trip through PRAGMA; Turso keeps them. For simple
          #     identifiers (e.g. CURRENT_TIMESTAMP), SQLite accepts the unwrapped
          #     form too, so emit without parens there.
          path = 'src/sqlite/class-wp-pdo-mysql-on-sqlite.php'
          src = open(path).read()
          old = (
              "\t\t\t\t} elseif ( str_contains( $column['EXTRA'], 'DEFAULT_GENERATED' ) ) {\n"
              "\t\t\t\t\t// Handle DEFAULT values with expressions (DEFAULT_GENERATED).\n"
              "\t\t\t\t\t// Translate the default clause from MySQL to SQLite.\n"
              "\t\t\t\t\t$ast            = $this->create_parser( 'SELECT ' . $column['COLUMN_DEFAULT'] )->parse();\n"
              "\t\t\t\t\t$expr           = $ast->get_first_descendant_node( 'selectItem' )->get_first_child_node();\n"
              "\t\t\t\t\t$default_clause = $this->translate( $expr );\n"
              "\t\t\t\t\t$query         .= sprintf( ' DEFAULT (%s)', $default_clause );\n"
              "\t\t\t\t}"
          )
          new = (
              "\t\t\t\t} elseif ( str_contains( $column['EXTRA'], 'DEFAULT_GENERATED' ) ) {\n"
              "\t\t\t\t\t$ast            = $this->create_parser( 'SELECT ' . $column['COLUMN_DEFAULT'] )->parse();\n"
              "\t\t\t\t\t$expr           = $ast->get_first_descendant_node( 'selectItem' )->get_first_child_node();\n"
              "\t\t\t\t\t$default_clause = trim( $this->translate( $expr ) );\n"
              "\t\t\t\t\t$dc_upper       = strtoupper( $default_clause );\n"
              "\t\t\t\t\t$is_keyword     = in_array( $dc_upper, array( 'CURRENT_TIMESTAMP', 'CURRENT_DATE', 'CURRENT_TIME' ), true );\n"
              "\t\t\t\t\tif ( $is_keyword || preg_match( '/^[A-Za-z_][A-Za-z_0-9]*$/', $default_clause ) ) {\n"
              "\t\t\t\t\t\t// Simple identifier or known keyword: emit without parens\n"
              "\t\t\t\t\t\t// so Turso's PRAGMA round-trip matches SQLite.\n"
              "\t\t\t\t\t\t$query .= ' DEFAULT ' . $default_clause;\n"
              "\t\t\t\t\t} else {\n"
              "\t\t\t\t\t\t$query .= sprintf( ' DEFAULT (%s)', $default_clause );\n"
              "\t\t\t\t\t}\n"
              "\t\t\t\t}"
          )
          assert old in src, 'DEFAULT_GENERATED block not found'
          src = src.replace(old, new, 1)

          # Also extend the existing CURRENT_TIMESTAMP literal special-case to
          # match "now()" (MySQL alias) so the DEFAULT_GENERATED branch isn't
          # taken at all for that input. Real SQLite normalizes this; this
          # makes our SQLite emission match.
          old_ct = (
              "\t\t\t\tif (\n"
              "\t\t\t\t\t'CURRENT_TIMESTAMP' === $column['COLUMN_DEFAULT']\n"
              "\t\t\t\t\t&& ( 'timestamp' === $column['DATA_TYPE'] || 'datetime' === $column['DATA_TYPE'] )\n"
              "\t\t\t\t) {\n"
              "\t\t\t\t\t$query .= ' DEFAULT CURRENT_TIMESTAMP';\n"
          )
          new_ct = (
              "\t\t\t\tif (\n"
              "\t\t\t\t\tin_array( strtolower( $column['COLUMN_DEFAULT'] ), array( 'current_timestamp', 'now()' ), true )\n"
              "\t\t\t\t\t&& ( 'timestamp' === $column['DATA_TYPE'] || 'datetime' === $column['DATA_TYPE'] )\n"
              "\t\t\t\t) {\n"
              "\t\t\t\t\t$query .= ' DEFAULT CURRENT_TIMESTAMP';\n"
          )
          assert old_ct in src, 'CURRENT_TIMESTAMP literal special case not found'
          src = src.replace(old_ct, new_ct, 1)

          open(path, 'w').write(src)
          print('patched DEFAULT_GENERATED simple-identifier unwrap + now() special case')

          # 14. Update Translation_Tests::testHexadecimalLiterals to match
          #     the hex-literal alias force patch (which needs to stay so
          #     Turso doesn't mangle x'417a' into 17a' at runtime).
          path = 'tests/WP_SQLite_Driver_Translation_Tests.php'
          src = open(path).read()
          for old_q, new_q in [
              ("\"SELECT x'417a'\",\n\t\t\t\"SELECT x'417a'\"",
               "\"SELECT x'417a' AS `x'417a'`\",\n\t\t\t\"SELECT x'417a'\""),
              ("\"SELECT X'417a'\",\n\t\t\t\"SELECT X'417a'\"",
               "\"SELECT X'417a' AS `X'417a'`\",\n\t\t\t\"SELECT X'417a'\""),
          ]:
              assert old_q in src, f'hex literal expectation not found: {old_q!r}'
              src = src.replace(old_q, new_q, 1)
          open(path, 'w').write(src)
          print('patched Translation_Tests testHexadecimalLiterals expectations')

          # 11. 6 Translation_Tests assert on the exact SQL emitted by
          #     sync_column_key_info. Our EXISTS rewrite (needed because
          #     Turso doesn't implement SQLite's "bare column alongside
          #     aggregate" extension) changes the emitted string, so the
          #     assertions fail even though behavior is correct. Update the
          #     expected strings in the test file to match the EXISTS form.
          import re
          path = 'tests/WP_SQLite_Driver_Translation_Tests.php'
          src = open(path).read()
          old_pattern = re.compile(
              r"UPDATE `_wp_sqlite_mysql_information_schema_columns` AS c "
              r"SET \(column_key, is_nullable\) = \( SELECT "
              r"CASE WHEN MAX\(s\.index_name = 'PRIMARY'\) THEN 'PRI' "
              r"WHEN MAX\(s\.non_unique = 0 AND s\.seq_in_index = 1\) THEN 'UNI' "
              r"WHEN MAX\(s\.seq_in_index = 1\) THEN 'MUL' ELSE '' END, "
              r"CASE WHEN MAX\(s\.index_name = 'PRIMARY'\) THEN 'NO' "
              r"ELSE c\.is_nullable END "
              r"FROM `_wp_sqlite_mysql_information_schema_statistics` AS s "
              r"WHERE s\.table_schema = c\.table_schema "
              r"AND s\.table_name = c\.table_name "
              r"AND s\.column_name = c\.column_name \) "
              r"WHERE c\.table_schema = 'sqlite_database' "
              r"AND c\.table_name = '(?P<tbl>[^']+)'"
          )
          def build_new(m):
              tbl = m.group('tbl')
              return (
                  "UPDATE `_wp_sqlite_mysql_information_schema_columns` AS c "
                  "SET column_key = CASE "
                  "WHEN EXISTS ( SELECT 1 FROM `_wp_sqlite_mysql_information_schema_statistics` AS s "
                  "WHERE s.table_schema = c.table_schema "
                  "AND s.table_name = c.table_name "
                  "AND s.column_name = c.column_name "
                  "AND s.index_name = 'PRIMARY' ) THEN 'PRI' "
                  "WHEN EXISTS ( SELECT 1 FROM `_wp_sqlite_mysql_information_schema_statistics` AS s "
                  "WHERE s.table_schema = c.table_schema "
                  "AND s.table_name = c.table_name "
                  "AND s.column_name = c.column_name "
                  "AND s.non_unique = 0 "
                  "AND s.seq_in_index = 1 ) THEN 'UNI' "
                  "WHEN EXISTS ( SELECT 1 FROM `_wp_sqlite_mysql_information_schema_statistics` AS s "
                  "WHERE s.table_schema = c.table_schema "
                  "AND s.table_name = c.table_name "
                  "AND s.column_name = c.column_name "
                  "AND s.seq_in_index = 1 ) THEN 'MUL' "
                  "ELSE '' END, "
                  "is_nullable = CASE "
                  "WHEN EXISTS ( SELECT 1 FROM `_wp_sqlite_mysql_information_schema_statistics` AS s "
                  "WHERE s.table_schema = c.table_schema "
                  "AND s.table_name = c.table_name "
                  "AND s.column_name = c.column_name "
                  "AND s.index_name = 'PRIMARY' ) THEN 'NO' "
                  "ELSE c.is_nullable END "
                  f"WHERE c.table_schema = 'sqlite_database' "
                  f"AND c.table_name = '{tbl}'"
              )
          new_src, n = old_pattern.subn(build_new, src)
          assert n > 0, 'no Translation_Tests UPDATE expectations matched'
          open(path, 'w').write(new_src)
          print(f'patched {n} Translation_Tests UPDATE expectations to EXISTS form')

          # 17. Turso evaluates correlated scalar subqueries in derived-table
          #     SELECT lists incorrectly: the outer alias binding is not
          #     refreshed per row, so a WHERE filter on the aliased column
          #     mismatches and the prior outer row's value leaks into the
          #     next row. The driver computes AUTO_INCREMENT for
          #     information_schema.tables / SHOW TABLE STATUS via such a
          #     correlated subquery, breaking 4 metadata tests. Replace it
          #     with an equivalent JOIN form (LEFT JOIN against a derived
          #     table marking auto_increment rows + sqlite_sequence) and a
          #     CASE expression at the projection.
          path = 'src/sqlite/class-wp-pdo-mysql-on-sqlite.php'
          src = open(path).read()

          # 17a. SHOW TABLE STATUS path.
          old_a = (
              "\t\t// Compose a subquery to compute auto-increment values.\n"
              "\t\t$has_sequence_table = (bool) $this->execute_sqlite_query(\n"
              "\t\t\t\"SELECT 1 FROM sqlite_master WHERE type = 'table' AND name = 'sqlite_sequence'\"\n"
              "\t\t)->fetchColumn();\n"
              "\n"
              "\t\t$auto_increment_subquery = sprintf(\n"
              "\t\t\t\"(\n"
              "\t\t\t\tSELECT COALESCE(s.seq + 1, 1)\n"
              "\t\t\t\tFROM %s AS c\n"
              "\t\t\t\t%s\n"
              "\t\t\t\tWHERE c.extra = 'auto_increment'\n"
              "\t\t\t\tAND c.table_schema = t.table_schema\n"
              "\t\t\t\tAND c.table_name = t.table_name\n"
              "\t\t\t)\",\n"
              "\t\t\t$this->quote_sqlite_identifier( $columns_table ),\n"
              "\t\t\t$has_sequence_table\n"
              "\t\t\t\t? 'LEFT JOIN main.sqlite_sequence AS s ON s.name = c.table_name'\n"
              "\t\t\t\t: 'LEFT JOIN (SELECT 0 AS seq) AS s'\n"
              "\t\t);\n"
              "\n"
              "\t\t$query  = sprintf(\n"
              "\t\t\t'SELECT * FROM (\n"
              "\t\t\t\tSELECT\n"
              "\t\t\t\t\ttable_name AS `Name`,\n"
              "\t\t\t\t\tengine AS `Engine`,\n"
              "\t\t\t\t\tversion AS `Version`,\n"
              "\t\t\t\t\trow_format AS `Row_format`,\n"
              "\t\t\t\t\ttable_rows AS `Rows`,\n"
              "\t\t\t\t\tavg_row_length AS `Avg_row_length`,\n"
              "\t\t\t\t\tdata_length AS `Data_length`,\n"
              "\t\t\t\t\tmax_data_length AS `Max_data_length`,\n"
              "\t\t\t\t\tindex_length AS `Index_length`,\n"
              "\t\t\t\t\tdata_free AS `Data_free`,\n"
              "\t\t\t\t\t%s AS `Auto_increment`,\n"
              "\t\t\t\t\tcreate_time AS `Create_time`,\n"
              "\t\t\t\t\tupdate_time AS `Update_time`,\n"
              "\t\t\t\t\tcheck_time AS `Check_time`,\n"
              "\t\t\t\t\ttable_collation AS `Collation`,\n"
              "\t\t\t\t\tchecksum AS `Checksum`,\n"
              "\t\t\t\t\tcreate_options AS `Create_options`,\n"
              "\t\t\t\t\ttable_comment AS `Comment`\n"
              "\t\t\t\tFROM %s AS t\n"
              "\t\t\t\tWHERE table_schema = ?\n"
              "\t\t\t)\n"
              "\t\t\tWHERE 1 %s\n"
              "\t\t\tORDER BY `Name`',\n"
              "\t\t\t$auto_increment_subquery,\n"
              "\t\t\t$this->quote_sqlite_identifier( $tables_table ),\n"
              "\t\t\t$condition ?? ''\n"
              "\t\t);\n"
          )
          new_a = (
              "\t\t// JOIN-based AUTO_INCREMENT computation (Turso mis-evaluates\n"
              "\t\t// correlated scalar subqueries in derived-table SELECT lists).\n"
              "\t\t$has_sequence_table = (bool) $this->execute_sqlite_query(\n"
              "\t\t\t\"SELECT 1 FROM sqlite_master WHERE type = 'table' AND name = 'sqlite_sequence'\"\n"
              "\t\t)->fetchColumn();\n"
              "\n"
              "\t\t$auto_increment_join = sprintf(\n"
              "\t\t\t\" LEFT JOIN (\n"
              "\t\t\t\tSELECT table_schema AS ai_schema, table_name AS ai_name, 1 AS has_ai\n"
              "\t\t\t\tFROM %s\n"
              "\t\t\t\tWHERE extra = 'auto_increment'\n"
              "\t\t\t\tGROUP BY table_schema, table_name\n"
              "\t\t\t) AS ai ON ai.ai_schema = t.table_schema AND ai.ai_name = t.table_name\",\n"
              "\t\t\t$this->quote_sqlite_identifier( $columns_table )\n"
              "\t\t);\n"
              "\t\tif ( $has_sequence_table ) {\n"
              "\t\t\t$auto_increment_join .= ' LEFT JOIN main.sqlite_sequence AS s ON s.name = t.table_name';\n"
              "\t\t\t$auto_increment_expr  = 'CASE WHEN ai.has_ai = 1 THEN COALESCE(s.seq + 1, 1) ELSE NULL END';\n"
              "\t\t} else {\n"
              "\t\t\t$auto_increment_expr = 'CASE WHEN ai.has_ai = 1 THEN 1 ELSE NULL END';\n"
              "\t\t}\n"
              "\n"
              "\t\t$query  = sprintf(\n"
              "\t\t\t'SELECT * FROM (\n"
              "\t\t\t\tSELECT\n"
              "\t\t\t\t\ttable_name AS `Name`,\n"
              "\t\t\t\t\tengine AS `Engine`,\n"
              "\t\t\t\t\tversion AS `Version`,\n"
              "\t\t\t\t\trow_format AS `Row_format`,\n"
              "\t\t\t\t\ttable_rows AS `Rows`,\n"
              "\t\t\t\t\tavg_row_length AS `Avg_row_length`,\n"
              "\t\t\t\t\tdata_length AS `Data_length`,\n"
              "\t\t\t\t\tmax_data_length AS `Max_data_length`,\n"
              "\t\t\t\t\tindex_length AS `Index_length`,\n"
              "\t\t\t\t\tdata_free AS `Data_free`,\n"
              "\t\t\t\t\t%s AS `Auto_increment`,\n"
              "\t\t\t\t\tcreate_time AS `Create_time`,\n"
              "\t\t\t\t\tupdate_time AS `Update_time`,\n"
              "\t\t\t\t\tcheck_time AS `Check_time`,\n"
              "\t\t\t\t\ttable_collation AS `Collation`,\n"
              "\t\t\t\t\tchecksum AS `Checksum`,\n"
              "\t\t\t\t\tcreate_options AS `Create_options`,\n"
              "\t\t\t\t\ttable_comment AS `Comment`\n"
              "\t\t\t\tFROM %s AS t%s\n"
              "\t\t\t\tWHERE table_schema = ?\n"
              "\t\t\t)\n"
              "\t\t\tWHERE 1 %s\n"
              "\t\t\tORDER BY `Name`',\n"
              "\t\t\t$auto_increment_expr,\n"
              "\t\t\t$this->quote_sqlite_identifier( $tables_table ),\n"
              "\t\t\t$auto_increment_join,\n"
              "\t\t\t$condition ?? ''\n"
              "\t\t);\n"
          )
          assert old_a in src, 'SHOW TABLE STATUS auto_increment block not found'
          src = src.replace(old_a, new_a, 1)

          # NOTE: The matching translate_table_ref information_schema.tables
          # path also has the buggy correlated subquery, but rewriting it to
          # the JOIN form triggers a Turso SIGSEGV in testReconstructTable
          # (the path is hypersensitive to information_schema.tables shape
          # changes). Keep the correlated form there and accept the loss of
          # testInformationSchemaTablesFilterByAutoIncrement until the Turso
          # pager fragility is fixed upstream.
          open(path, 'w').write(src)
          print('patched AUTO_INCREMENT correlated-subquery -> JOIN form (SHOW TABLE STATUS only)')

          # 18. The YEAR type cast in cast_value_for_saving uses a nested
          #     subquery to alias the integer cast as `value`:
          #
          #         (SELECT CASE WHEN value IS NULL THEN NULL ... END
          #          FROM (SELECT CAST(<column-ref> AS INTEGER) AS value))
          #
          #     where <column-ref> is `column1`, `column17`, etc. — a
          #     reference into the outer FROM (VALUES (...)) of the
          #     enclosing INSERT-SELECT. Turso fails to resolve the
          #     two-level-correlated reference and reports
          #     "Parse error: no such column: columnN", which breaks 6
          #     tests (testNonStrictModeTypeCasting,
          #     testColumnInfoForDateAndTimeDataTypes, the four
          #     testCastValues* — all of which insert into a YEAR column
          #     via INSERT...VALUES). Single-level correlated references
          #     (probed in step 17/probe) and the flat CASE forms used
          #     by date/time/datetime/timestamp work fine.
          #
          #     Flatten the YEAR cast to inline the `CAST(... AS INTEGER)`
          #     at every WHEN, removing the inner derived FROM. CAST is
          #     idempotent so this is semantically identical and avoids
          #     the two-level binding.
          path = 'src/sqlite/class-wp-pdo-mysql-on-sqlite.php'
          src = open(path).read()
          old_year = (
              "\t\t\t\t\treturn sprintf(\n"
              "\t\t\t\t\t\t\"(\n"
              "\t\t\t\t\t\t\tSELECT CASE\n"
              "\t\t\t\t\t\t\t\tWHEN value IS NULL THEN NULL\n"
              "\t\t\t\t\t\t\t\tWHEN value = 0 THEN '0000'\n"
              "\t\t\t\t\t\t\t\tWHEN value BETWEEN 1901 AND 2155 THEN value\n"
              "\t\t\t\t\t\t\t\tWHEN value BETWEEN 1 AND 69 THEN 2000 + value\n"
              "\t\t\t\t\t\t\t\tWHEN value BETWEEN 70 AND 99 THEN 1900 + value\n"
              "\t\t\t\t\t\t\t\tELSE %s\n"
              "\t\t\t\t\t\t\tEND\n"
              "\t\t\t\t\t\t\tFROM (SELECT CAST(%s AS INTEGER) AS value)\n"
              "\t\t\t\t\t\t)\",\n"
              "\t\t\t\t\t\t$is_strict_mode\n"
              "\t\t\t\t\t\t\t? sprintf( \"THROW('Out of range value: ''' || %s || '''')\", $translated_value )\n"
              "\t\t\t\t\t\t\t: \"'0000'\",\n"
              "\t\t\t\t\t\t$translated_value\n"
              "\t\t\t\t\t);\n"
          )
          new_year = (
              "\t\t\t\t\treturn sprintf(\n"
              "\t\t\t\t\t\t\"CASE\n"
              "\t\t\t\t\t\t\tWHEN CAST(%s AS INTEGER) IS NULL THEN NULL\n"
              "\t\t\t\t\t\t\tWHEN CAST(%s AS INTEGER) = 0 THEN '0000'\n"
              "\t\t\t\t\t\t\tWHEN CAST(%s AS INTEGER) BETWEEN 1901 AND 2155 THEN CAST(%s AS INTEGER)\n"
              "\t\t\t\t\t\t\tWHEN CAST(%s AS INTEGER) BETWEEN 1 AND 69 THEN 2000 + CAST(%s AS INTEGER)\n"
              "\t\t\t\t\t\t\tWHEN CAST(%s AS INTEGER) BETWEEN 70 AND 99 THEN 1900 + CAST(%s AS INTEGER)\n"
              "\t\t\t\t\t\t\tELSE %s\n"
              "\t\t\t\t\t\tEND\",\n"
              "\t\t\t\t\t\t$translated_value,\n"
              "\t\t\t\t\t\t$translated_value,\n"
              "\t\t\t\t\t\t$translated_value,\n"
              "\t\t\t\t\t\t$translated_value,\n"
              "\t\t\t\t\t\t$translated_value,\n"
              "\t\t\t\t\t\t$translated_value,\n"
              "\t\t\t\t\t\t$translated_value,\n"
              "\t\t\t\t\t\t$translated_value,\n"
              "\t\t\t\t\t\t$is_strict_mode\n"
              "\t\t\t\t\t\t\t? sprintf( \"THROW('Out of range value: ''' || %s || '''')\", $translated_value )\n"
              "\t\t\t\t\t\t\t: \"'0000'\"\n"
              "\t\t\t\t\t);\n"
          )
          assert old_year in src, 'YEAR cast nested-subquery block not found'
          src = src.replace(old_year, new_year, 1)
          open(path, 'w').write(src)
          print('patched YEAR cast nested-subquery -> flat CASE form')

          # 19. testCreateTableWithDefaultExpressions queries
          #     `PRAGMA table_info(t)` directly and asserts the dflt_value
          #     column for `DEFAULT (1 + 2)` is the unparenthesised
          #     '1 + 2'. Real SQLite strips outer parens at CREATE-time
          #     storage; Turso preserves them, so the PRAGMA returns
          #     '(1 + 2)'. Patching either Turso pragma.rs (emit-time)
          #     or schema.rs (storage-time) crashes testReconstructTable
          #     in Turso's pager. Update the test's expected PRAGMA value
          #     to '(1 + 2)' so the assertion matches Turso's behaviour;
          #     all the other assertions in this test (driver-level
          #     SHOW CREATE TABLE / DESCRIBE / actual default value)
          #     pass via the reconstructor's existing paren-strip and
          #     don't need changes.
          path = 'tests/WP_SQLite_Driver_Tests.php'
          src = open(path).read()
          # `(1 + 2)` simple expression: Turso preserves outer parens.
          old_a = "\t\t$this->assertSame( '1 + 2', $result[1]['dflt_value'] );\n"
          new_a = "\t\t$this->assertSame( '(1 + 2)', $result[1]['dflt_value'] );\n"
          assert old_a in src, 'PRAGMA result[1] assertion not found'
          src = src.replace(old_a, new_a, 1)
          # Translated DATETIME(...) call: Turso preserves outer parens AND
          # inserts a space between the function name and the opening paren
          # in its PRAGMA echo of the stored default expression.
          old_b = (
              "\t\t$this->assertSame( \"DATETIME(CURRENT_TIMESTAMP, '+' || 1 || ' YEAR')\", "
              "$result[2]['dflt_value'] );\n"
          )
          new_b = (
              "\t\t$this->assertSame( \"(DATETIME (CURRENT_TIMESTAMP, '+' || 1 || ' YEAR'))\", "
              "$result[2]['dflt_value'] );\n"
          )
          assert old_b in src, 'PRAGMA result[2] assertion not found'
          src = src.replace(old_b, new_b, 1)
          # Translated CONCAT call uses `||`. Real SQLite stores it as
          # `('a' || 'b')` (one paren level); Turso double-wraps and
          # echoes it as `(('a' || 'b'))` from PRAGMA.
          old_c = (
              "\t\t$this->assertSame( \"('a' || 'b')\", $result[3]['dflt_value'] );\n"
          )
          new_c = (
              "\t\t$this->assertSame( \"(('a' || 'b'))\", $result[3]['dflt_value'] );\n"
          )
          assert old_c in src, 'PRAGMA result[3] assertion not found'
          src = src.replace(old_c, new_c, 1)
          open(path, 'w').write(src)
          print('patched testCreateTableWithDefaultExpressions PRAGMA expectations for Turso')

          # 20. Turso can acknowledge CREATE TEMP TABLE while another
          #     connection holds a main-database write lock without making
          #     the table visible to the following INSERT. That breaks the
          #     zero-column PDO statement used for SET results. A supported,
          #     connection-local PRAGMA produces the same zero-column,
          #     PDOStatement without touching either database. Turso retains
          #     sqlite3_changes() across the PRAGMA, so explicitly normalize
          #     an otherwise-unknown affected-row count to zero.
          path = 'src/sqlite/class-wp-pdo-mysql-on-sqlite.php'
          src = open(path).read()
          old = (
              "\t\t/*\n"
              "\t\t * With 0 columns, we need to create a PDO statement that has no columns.\n"
              "\t\t * This can be done using a noop INSERT statement that modifies no data.\n"
              "\t\t */\n"
              "\t\tif ( 0 === count( $columns ) ) {\n"
              "\t\t\t/*\n"
              "\t\t\t * Build a 0-column statement to represent an empty result set.\n"
              "\t\t\t *\n"
              "\t\t\t * A no-op \"INSERT ... WHERE FALSE\" into a regular table still acquires\n"
              "\t\t\t * SQLite's write lock, even though it writes nothing. That makes\n"
              "\t\t\t * no-write statements such as \"SET sql_mode = ...\" fatal with\n"
              "\t\t\t * \"database is locked\" whenever another connection holds the write\n"
              "\t\t\t * lock. Writing to a connection-private TEMP table uses the temp\n"
              "\t\t\t * database, which has no shared lock, so it never contends.\n"
              "\t\t\t */\n"
              "\t\t\tif ( ! $this->empty_result_table_ready ) {\n"
              "\t\t\t\t$pdo->exec(\n"
              "\t\t\t\t\tsprintf(\n"
              "\t\t\t\t\t\t'CREATE TEMP TABLE IF NOT EXISTS %s ( placeholder_for_empty_insert )',\n"
              "\t\t\t\t\t\t$this->quote_sqlite_identifier( self::EMPTY_RESULT_TABLE_NAME )\n"
              "\t\t\t\t\t)\n"
              "\t\t\t\t);\n"
              "\t\t\t\t$this->empty_result_table_ready = true;\n"
              "\t\t\t}\n"
              "\t\t\treturn $pdo->query(\n"
              "\t\t\t\tsprintf(\n"
              "\t\t\t\t\t'INSERT INTO %s ( placeholder_for_empty_insert ) SELECT NULL WHERE FALSE',\n"
              "\t\t\t\t\t$this->quote_sqlite_identifier( self::EMPTY_RESULT_TABLE_NAME )\n"
              "\t\t\t\t)\n"
              "\t\t\t);"
          )
          new = (
              "\t\t/*\n"
              "\t\t * With 0 columns, return a connection-local statement that has no\n"
              "\t\t * columns and changes no rows.\n"
              "\t\t */\n"
              "\t\tif ( 0 === count( $columns ) ) {\n"
              "\t\t\t/*\n"
              "\t\t\t * Turso can acknowledge TEMP-table creation during a concurrent main\n"
              "\t\t\t * write without making the table visible to the following INSERT. This\n"
              "\t\t\t * supported connection-local PRAGMA yields a zero-column statement\n"
              "\t\t\t * without touching either database. Normalize an unknown affected-row\n"
              "\t\t\t * count because Turso retains sqlite3_changes() across the PRAGMA.\n"
              "\t\t\t */\n"
              "\t\t\tif ( null === $this->last_affected_rows ) {\n"
              "\t\t\t\t$this->last_affected_rows = 0;\n"
              "\t\t\t}\n"
              "\t\t\treturn $pdo->query( 'PRAGMA foreign_keys = ON' );"
          )
          assert old in src, 'zero-column TEMP-table result block not found'
          open(path, 'w').write(src.replace(old, new, 1))
          print('patched zero-column result statement for Turso lock handling')

          # 21. Turso is WAL-only and maps EXTRA / integer 3 synchronous
          #     settings to FULL / 2. Keep the new connection-option tests
          #     running in this lane, but assert Turso's actual PRAGMA values.
          def replace_in_test_method(source, method, old, new):
              pattern = re.compile(
                  rf'(\tpublic function {method}\([^)]*\)[^{{]*\{{\n)(.*?)(\n\t\}})',
                  re.DOTALL,
              )
              match = pattern.search(source)
              assert match is not None, f'{method} method not found'
              body = match.group(2)
              assert old in body, f'{method} expectation block not found'
              body = body.replace(old, new, 1)
              return source[:match.start(2)] + body + source[match.end(2):]

          path = 'tests/WP_SQLite_Connection_Tests.php'
          src = open(path).read()
          updates = {
              'testJournalModeCanBeOverridden': [
                  ("\t\t$this->assertSame( 'delete', $this->get_journal_mode( $connection ) );",
                   "\t\t$this->assertSame( 'wal', $this->get_journal_mode( $connection ) );"),
              ],
              'testRollbackJournalModeKeepsDefaultSynchronous': [
                  ("\t\t$this->assertSame( '2', $this->get_synchronous( $connection ) );",
                   "\t\t$this->assertSame( '1', $this->get_synchronous( $connection ) );"),
              ],
              'testInMemoryDatabaseKeepsDefaultSynchronous': [
                  (
                      "\t\t$this->assertSame( 'memory', $this->get_journal_mode( $connection ) );\n"
                      "\t\t$this->assertSame( '2', $this->get_synchronous( $connection ) );",
                      "\t\t$this->assertSame( 'wal', $this->get_journal_mode( $connection ) );\n"
                      "\t\t$this->assertSame( '1', $this->get_synchronous( $connection ) );",
                  ),
              ],
              'testJournalModeAndSynchronousAreCaseInsensitive': [
                  (
                      "\t\t$this->assertSame( 'delete', $this->get_journal_mode( $connection ) );\n"
                      "\t\t$this->assertSame( '3', $this->get_synchronous( $connection ) );",
                      "\t\t$this->assertSame( 'wal', $this->get_journal_mode( $connection ) );\n"
                      "\t\t$this->assertSame( '2', $this->get_synchronous( $connection ) );",
                  ),
              ],
              'testSynchronousAcceptsIntegerValues': [
                  ("\t\t$this->assertSame( '3', $this->get_synchronous( $connection ) );",
                   "\t\t$this->assertSame( '2', $this->get_synchronous( $connection ) );"),
              ],
              'testDefaultJournalModeFallsBackWhenWalIsUnavailable': [
                  (
                      "\t\t$this->assertSame( 'delete', $this->get_journal_mode( $connection ) );\n"
                      "\t\t$this->assertSame( '2', $this->get_synchronous( $connection ) );",
                      "\t\t$this->assertSame( 'wal', $this->get_journal_mode( $connection ) );\n"
                      "\t\t$this->assertSame( '1', $this->get_synchronous( $connection ) );",
                  ),
              ],
              'testExplicitJournalModeSurfacesFailureWhenWalIsUnavailable': [
                  (
                      "\t\t$this->expectException( PDOException::class );\n"
                      "\t\tnew WP_SQLite_Connection(\n"
                      "\t\t\tarray(\n"
                      "\t\t\t\t'path'         => $this->db_path,\n"
                      "\t\t\t\t'journal_mode' => 'WAL',\n"
                      "\t\t\t)\n"
                      "\t\t);",
                      "\t\t$connection = new WP_SQLite_Connection(\n"
                      "\t\t\tarray(\n"
                      "\t\t\t\t'path'         => $this->db_path,\n"
                      "\t\t\t\t'journal_mode' => 'WAL',\n"
                      "\t\t\t)\n"
                      "\t\t);\n\n"
                      "\t\t$this->assertSame( 'wal', $this->get_journal_mode( $connection ) );\n"
                      "\t\t$this->assertSame( '1', $this->get_synchronous( $connection ) );",
                  ),
              ],
              'testDriverKeepsConfiguredJournalMode': [
                  (
                      "\t\t$this->assertSame( 'delete', $this->get_journal_mode( $driver->get_connection() ) );",
                      "\t\t$this->assertSame( 'wal', $this->get_journal_mode( $driver->get_connection() ) );",
                  ),
              ],
          }
          for method, replacements in updates.items():
              for old, new in replacements:
                  src = replace_in_test_method(src, method, old, new)
          open(path, 'w').write(src)

          path = 'tests/WP_PDO_MySQL_On_SQLite_PDO_API_Tests.php'
          src = open(path).read()
          src = replace_in_test_method(
              src,
              'test_journal_mode_and_synchronous_driver_options',
              "\t\t\t\t'delete',",
              "\t\t\t\t'wal',",
          )
          open(path, 'w').write(src)
          print('patched journal-mode expectations for Turso')
          PY

      - name: Probe — capture exact SQL the driver emits in failing tests
        continue-on-error: true
        env:
          LD_PRELOAD: ${{ steps.preload.outputs.value }}
          # Use Turso's tracing to log every prepared SQL statement.
          RUST_LOG: 'turso_core::translate=trace,turso_core::vdbe::insn=info'
        working-directory: packages/mysql-on-sqlite
        run: |
          set +e
          # Add a hard timeout so a hung probe step doesn't block the
          # whole job; head -2500 keeps log size reasonable.
          timeout --kill-after=5 60 \
            php <<'PHP' 2>&1 | head -2500
          <?php
          // Boot the driver, run failing test scenarios. With RUST_LOG
          // including translate=trace, Turso prints each prepared SQL
          // to stderr (which we route to stdout for `head -800`).
          require __DIR__ . '/vendor/autoload.php';
          require __DIR__ . '/tests/bootstrap.php';

          function run_test(string $label, callable $f): void {
              fwrite(STDERR, "\n=== START $label ===\n");
              try {
                  $pdo_class = PHP_VERSION_ID >= 80400 ? PDO\SQLite::class : PDO::class;
                  $sqlite = new $pdo_class('sqlite::memory:');
                  $conn = new WP_SQLite_Connection(['pdo' => $sqlite]);
                  $engine = new WP_SQLite_Driver($conn, 'wp');
                  $f($engine, $sqlite);
                  fwrite(STDERR, "=== OK $label ===\n");
              } catch (Throwable $e) {
                  fwrite(STDERR, "=== FAIL $label: " . $e->getMessage() . " ===\n");
              }
          }

          run_test('testCreateTemporaryTable (with WP_SQLite_Driver_Tests::setUp prefix)', function ($engine) {
              // Mirror WP_SQLite_Driver_Tests::setUp() — creates 2 permanent
              // tables with AUTO_INCREMENT BEFORE the temp table operation.
              $engine->query("CREATE TABLE _options (
                  ID INTEGER PRIMARY KEY AUTO_INCREMENT NOT NULL,
                  option_name TEXT NOT NULL default '',
                  option_value TEXT NOT NULL default ''
              )");
              $engine->query("CREATE TABLE _dates (
                  ID INTEGER PRIMARY KEY AUTO_INCREMENT NOT NULL,
                  option_name TEXT NOT NULL default '',
                  option_value DATETIME NOT NULL
              )");
              $engine->query('CREATE TEMPORARY TABLE _tmp_table (
                  ID INTEGER PRIMARY KEY AUTO_INCREMENT NOT NULL,
                  option_name TEXT NOT NULL default \'\',
                  option_value TEXT NOT NULL default \'\'
              )');
              $engine->query('DROP TEMPORARY TABLE _tmp_table');
          });

          run_test('testInformationSchemaTablesFilterByAutoIncrement', function ($engine) {
              $engine->query('CREATE TABLE low (id INT AUTO_INCREMENT PRIMARY KEY, name TEXT)');
              $engine->query('CREATE TABLE high (id INT AUTO_INCREMENT PRIMARY KEY, name TEXT)');
              $engine->query('CREATE TABLE plain (id INT, name TEXT)');
              $engine->query("INSERT INTO low (name) VALUES ('a')");
              $engine->query("INSERT INTO high (name) VALUES ('a'), ('b'), ('c'), ('d'), ('e')");
              $r = $engine->query('SELECT TABLE_NAME FROM information_schema.tables WHERE `AUTO_INCREMENT` > 3');
              fwrite(STDERR, "  -> " . count($r) . " row(s): " . json_encode(array_map(fn($o) => $o->TABLE_NAME, $r)) . "\n");
          });

          run_test('testTemporaryTableHasPriorityOverStandardTable (with WP_SQLite_Driver_Tests::setUp prefix)', function ($engine) {
              $engine->query("CREATE TABLE _options (
                  ID INTEGER PRIMARY KEY AUTO_INCREMENT NOT NULL,
                  option_name TEXT NOT NULL default '',
                  option_value TEXT NOT NULL default ''
              )");
              $engine->query("CREATE TABLE _dates (
                  ID INTEGER PRIMARY KEY AUTO_INCREMENT NOT NULL,
                  option_name TEXT NOT NULL default '',
                  option_value DATETIME NOT NULL
              )");
              $engine->query('CREATE TABLE t (a INT, INDEX ia(a))');
              $engine->query('CREATE TEMPORARY TABLE t (b INT, INDEX ib(b))');
              $engine->query('SHOW CREATE TABLE t');
              $engine->query('SHOW COLUMNS FROM t');
              $engine->query('DESCRIBE t');
              $engine->query('SHOW INDEXES FROM t');
              $engine->query('ALTER TABLE t ADD COLUMN c INT');
              $engine->query('SHOW COLUMNS FROM t');
          });
          PHP
          echo "(probe step: continue-on-error)"

      - name: Probe — testTemporaryTableHasPriority isolated, querying-only filter
        continue-on-error: true
        env:
          LD_PRELOAD: ${{ steps.preload.outputs.value }}
          # translate=trace gives us "querying <SQL>" lines plus a lot of DEBUG
          # translate_expr noise. We grep down to just the SQL + errors so the
          # whole test trace fits in the log even with many statements.
          RUST_LOG: 'turso_core::translate=trace,turso_core::storage=warn'
        working-directory: packages/mysql-on-sqlite
        run: |
          set +e
          timeout --kill-after=5 60 \
            php <<'PHP' 2>&1 \
            | grep -E '(querying |ERROR|WARN|=== |  -> |short read|page is pinned|page [0-9]+ is)' \
            | head -800
          <?php
          // Same scenario as the SQL-capture probe, but isolated to the failing
          // test so its trace doesn't get flushed by the upstream truncation.
          require __DIR__ . '/vendor/autoload.php';
          require __DIR__ . '/tests/bootstrap.php';

          $pdo_class = PHP_VERSION_ID >= 80400 ? PDO\SQLite::class : PDO::class;
          $sqlite = new $pdo_class('sqlite::memory:');
          $conn = new WP_SQLite_Connection(['pdo' => $sqlite]);
          $engine = new WP_SQLite_Driver($conn, 'wp');

          $statements = [
              "CREATE TABLE _options (
                  ID INTEGER PRIMARY KEY AUTO_INCREMENT NOT NULL,
                  option_name TEXT NOT NULL default '',
                  option_value TEXT NOT NULL default ''
              )",
              "CREATE TABLE _dates (
                  ID INTEGER PRIMARY KEY AUTO_INCREMENT NOT NULL,
                  option_name TEXT NOT NULL default '',
                  option_value DATETIME NOT NULL
              )",
              'CREATE TABLE t (a INT, INDEX ia(a))',
              'CREATE TEMPORARY TABLE t (b INT, INDEX ib(b))',
              'SHOW CREATE TABLE t',
              'SHOW COLUMNS FROM t',
              'DESCRIBE t',
              'SHOW INDEXES FROM t',
              'ALTER TABLE t ADD COLUMN c INT',
              'SHOW COLUMNS FROM t',
          ];
          foreach ($statements as $sql) {
              $first = strtok($sql, "\n");
              fwrite(STDERR, "\n=== STMT: $first ===\n");
              try {
                  $engine->query($sql);
                  fwrite(STDERR, "  -> ok\n");
              } catch (Throwable $e) {
                  fwrite(STDERR, "=== FAIL $first -> " . $e->getMessage() . " ===\n");
              }
          }
          PHP
          echo "(probe step: continue-on-error)"

      - name: Run PHPUnit tests against Turso DB
        env:
          LD_PRELOAD: ${{ steps.preload.outputs.value }}
        working-directory: packages/mysql-on-sqlite
        # Turso still leaves process-global native state behind between some
        # PDO-heavy test classes. Running the whole suite in one PHP process can
        # corrupt a later class before PHPUnit flushes JUnit. Run each class in a
        # fresh PHP process and aggregate JUnit; this keeps all tests covered
        # while avoiding cross-class Turso state poisoning.
        run: |
          set +e

          python3 <<'PY' > /tmp/phpunit-turso-classes.txt
          import pathlib
          import re

          for path in sorted(pathlib.Path('tests').rglob('*_Tests.php')):
              match = re.search(r'^class\s+(\w+)\s+extends\s+TestCase\b', path.read_text(), re.M)
              if not match:
                  continue

              class_name = match.group(1)
              # The two CSV-driven server-suite classes tokenize/parse a
              # 5.7 MB fixture in a single loop and run well over 10 min under
              # LD_PRELOAD. That is not Turso-specific coverage.
              if class_name.startswith('WP_MySQL_Server_Suite_'):
                  continue

              print(class_name)
          PY

          rm -f /tmp/phpunit-turso-*.xml /tmp/phpunit-turso-*.stdout /tmp/phpunit-turso-exits.txt

          # Keep --debug: per-test logging forces I/O flushes that prevent
          # Turso from accumulating state which crashes PHPUnit mid-run.
          while IFS= read -r class_name; do
              echo "::group::${class_name}"
              timeout --kill-after=10 300 \
                  php ./vendor/bin/phpunit -c ./phpunit.xml.dist \
                      --debug \
                      --filter "^${class_name}::" \
                      --log-junit "/tmp/phpunit-turso-${class_name}.xml" \
                      | tee "/tmp/phpunit-turso-${class_name}.stdout"
              ec=${PIPESTATUS[0]}
              echo "${class_name} ${ec}" >> /tmp/phpunit-turso-exits.txt
              echo "::endgroup::"
          done < /tmp/phpunit-turso-classes.txt

          python3 <<'PY'
          import os
          import sys
          import xml.etree.ElementTree as ET

          classes = [line.strip() for line in open('/tmp/phpunit-turso-classes.txt') if line.strip()]
          exits = {}
          if os.path.exists('/tmp/phpunit-turso-exits.txt'):
              for line in open('/tmp/phpunit-turso-exits.txt'):
                  name, code = line.rsplit(' ', 1)
                  exits[name] = int(code)

          total = 0
          assertions = 0
          errors = 0
          failures = 0
          skipped = 0
          skipped_cases = []
          missing = []
          unparsable = []

          for class_name in classes:
              junit = f'/tmp/phpunit-turso-{class_name}.xml'
              if not os.path.exists(junit) or 0 == os.path.getsize(junit):
                  missing.append(class_name)
                  continue

              try:
                  cases = list(ET.parse(junit).iter('testcase'))
              except ET.ParseError as e:
                  unparsable.append((class_name, str(e)))
                  continue

              class_errors = sum(1 for c in cases if c.find('error') is not None)
              class_failures = sum(1 for c in cases if c.find('failure') is not None)
              class_skipped = sum(1 for c in cases if c.find('skipped') is not None)

              total += len(cases)
              assertions += sum(int(c.get('assertions', 0) or 0) for c in cases)
              errors += class_errors
              failures += class_failures
              skipped += class_skipped
              skipped_cases.extend(c for c in cases if c.find('skipped') is not None)

              exit_code = exits.get(class_name, 0)
              if exit_code and not class_errors and not class_failures:
                  print(
                      f'::warning::{class_name} exited with {exit_code} after writing '
                      'JUnit; treating it as a Turso process-shutdown crash.'
                  )

          for class_name in missing:
              stdout = f'/tmp/phpunit-turso-{class_name}.stdout'
              print(f'::error::{class_name} produced no JUnit summary (exit={exits.get(class_name, "?")}).')
              if os.path.exists(stdout):
                  print(f'::group::{class_name} stdout tail')
                  print(''.join(open(stdout).readlines()[-40:]))
                  print('::endgroup::')

          for class_name, message in unparsable:
              print(f'::error::{class_name} produced unparsable JUnit: {message}')

          if skipped_cases:
              print('::group::Skipped/incomplete tests')
              for c in skipped_cases:
                  cls = c.get('classname', '?')
                  name = c.get('name', '?')
                  msg = (c.find('skipped').get('message') or '').strip()
                  print(f'  - {cls}::{name} -- {msg}')
              print('::endgroup::')

          passing = total - errors - failures - skipped
          print(f"::notice::Turso DB: {passing}/{total} passing "
                f"(errors={errors}, failures={failures}, skipped={skipped}, "
                f"assertions={assertions}, classes={len(classes)})")
          sys.exit(1 if missing or unparsable or errors or failures else 0)
          PY
